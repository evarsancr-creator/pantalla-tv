<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pantalla Corporativa DABS</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background-color: #0d1117;
        }


        /* =====================================================
           CONTENEDOR GENERAL
        ===================================================== */

        .pantalla-completa {
            display: flex;
            flex-direction: column;

            width: 100vw;
            height: 100vh;

            padding: 20px;
            gap: 15px;

            position: relative;
            z-index: 5;
        }


        /* =====================================================
           ENCABEZADO
        ===================================================== */

        .marco-superior {
            width: 100%;
            height: 15vh;

            background: rgba(13, 17, 23, 0.15);

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4);

            position: relative;

            top: 0;
            left: 0;

            transition:
                top 0.5s ease,
                left 0.5s ease,
                opacity 1s ease,
                filter 1s ease;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .contenedor-logo {
            height: 80%;

            display: flex;
            align-items: center;
        }


        .logo-ccss {
            height: 100%;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(255, 255, 255, 0.15)
                );
        }


        /* =====================================================
           TÍTULOS
        ===================================================== */

        .bloque-titulos {
            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            flex-grow: 1;

            padding: 0 20px;

            text-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.8);
        }


        .texto-institucion-gerencia {
            color: #60a5fa;

            font-size: 1.1vw;
            font-weight: 600;

            letter-spacing: 1px;

            text-transform: uppercase;

            margin-bottom: 2px;
        }


        .texto-direccion {
            color: #e2e8f0;

            font-size: 1.9vw;
            font-weight: 700;

            letter-spacing: 0.5px;

            text-transform: uppercase;

            text-align: center;
        }


        /* =====================================================
           RELOJ
        ===================================================== */

        .tiempo-contenedor {
            display: flex;
            flex-direction: column;

            align-items: flex-end;
            justify-content: center;

            min-width: 220px;
        }


        .reloj {
            color: #cbd5e1;

            font-size: 2.4vw;
            font-weight: 700;

            font-family:
                "Segoe UI",
                sans-serif;

            text-shadow:
                0 0 8px rgba(224, 242, 254, 0.2),
                0 2px 4px rgba(0, 0, 0, 0.6);

            line-height: 1;

            margin-bottom: 4px;

            letter-spacing: -1px;
        }


        .fecha {
            color: #94a3b8;

            font-size: 1.1vw;
            font-weight: 500;

            letter-spacing: 0.5px;

            text-shadow:
                0 1px 3px
                rgba(0, 0, 0, 0.6);
        }


        /* =====================================================
           SLIDESHOW
        ===================================================== */

        .slideshow-container {
            width: 100%;
            height: 79vh;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color:
                rgba(0, 0, 0, 0.2);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, 0.6);
        }


        /* =====================================================
           IMÁGENES PRINCIPALES

           IMPORTANTE:
           width + height al 100% hace que imágenes pequeñas
           también se amplíen.

           contain evita deformarlas o recortarlas.
        ===================================================== */

        img.slide {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;
            object-position: center center;

            opacity: 0;

            z-index: 2;

            transform: scale(0.98);

            transition:
                opacity 1.2s ease-in-out,
                transform 1.2s ease-in-out;
        }


        img.slide.active {
            opacity: 1;

            transform: scale(1);
        }


        /* =====================================================
           FONDO AMBIENTE
        ===================================================== */

        .background-ambientes {
            position: absolute;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            z-index: 1;

            overflow: hidden;

            background-color: #0d1117;

            transition:
                filter 1s ease;
        }


        img.slide-bg {
            position: absolute;

            top: -5%;
            left: -5%;

            width: 110%;
            height: 110%;

            object-fit: cover;

            opacity: 0;

            filter:
                blur(60px)
                brightness(0.4)
                saturate(1.4);

            transform: scale(1.08);

            transition:
                opacity 1.2s ease-in-out;
        }


        img.slide-bg.active {
            opacity: 1;
        }


        /* =====================================================
           MENSAJE DE ESTADO
        ===================================================== */

        .mensaje-estado {
            color: #cbd5e1;

            font-size: 1.3vw;
            font-weight: 500;

            text-align: center;

            padding: 30px;

            z-index: 10;
        }


        /* =====================================================
           INDICADOR DE CONEXIÓN

           Verde  = funcionamiento normal
           Amarillo = actualizando
           Rojo = problema de consulta

           Se mantiene discreto en la esquina inferior derecha.
        ===================================================== */

        .indicador-estado {
            position: fixed;

            right: 8px;
            bottom: 8px;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #64748b;

            z-index: 100;

            opacity: 0.55;

            box-shadow:
                0 0 6px
                rgba(255,255,255,0.15);

            transition:
                background 0.4s ease;
        }


        .estado-ok {
            background: #22c55e;
        }


        .estado-consultando {
            background: #f59e0b;
        }


        .estado-error {
            background: #ef4444;
        }


        /* =====================================================
           MODO ECO
        ===================================================== */

        .modo-eco .marco-superior {
            opacity: 0.3;

            background:
                rgba(13, 17, 23, 0.3);

            filter:
                grayscale(0.5);
        }


        .modo-eco .background-ambientes {
            filter:
                brightness(0.1);
        }


        /* =====================================================
           AJUSTES PARA PANTALLAS PEQUEÑAS
        ===================================================== */

        @media (max-width: 900px) {

            .pantalla-completa {
                padding: 10px;
                gap: 10px;
            }

            .marco-superior {
                padding: 0 15px;
            }

            .tiempo-contenedor {
                min-width: 140px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         FONDO
    ====================================================== -->

    <div
        class="background-ambientes"
        id="bg-ambientes">
    </div>


    <!-- =====================================================
         CONTENIDO
    ====================================================== -->

    <div
        class="pantalla-completa"
        id="contenedor-principal">


        <!-- =================================================
             ENCABEZADO
        ================================================== -->

        <header
            class="marco-superior"
            id="barra-institucional">


            <div class="contenedor-logo">

                <img
                    class="logo-ccss"
                    src="logo-ccss.png"
                    alt="Logo CCSS"
                >

            </div>


            <div class="bloque-titulos">

                <h2 class="texto-institucion-gerencia">
                    Caja Costarricense de Seguro Social -
                    Gerencia de Logística
                </h2>

                <h1 class="texto-direccion">
                    Dirección de Aprovisionamiento
                    de Bienes y Servicios
                </h1>

            </div>


            <div class="tiempo-contenedor">

                <div
                    class="reloj"
                    id="reloj">
                    00:00
                </div>

                <div
                    class="fecha"
                    id="fecha">
                    Cargando...
                </div>

            </div>


        </header>


        <!-- =================================================
             SLIDESHOW
        ================================================== -->

        <main
            class="slideshow-container"
            id="slideshow">

            <div class="mensaje-estado">
                Cargando imágenes...
            </div>

        </main>


    </div>


    <!-- Indicador diagnóstico -->

    <div
        id="indicador-estado"
        class="indicador-estado estado-consultando"
        title="Inicializando pantalla">
    </div>



<script>


// ======================================================
// 1. CONFIGURACIÓN
// ======================================================

const usuarioGitHub =
    "evarsancr-creator";


const repositorioGitHub =
    "pantalla-tv";


const carpetaImagenes =
    "imagenes";


// Cada imagen permanece 8 segundos.

const tiempoPredeterminado =
    8000;


// Revisión normal de GitHub.
//
// IMPORTANTE:
// Esto NO refresca la página.

const intervaloConsultaNormal =
    5 * 60 * 1000;


// Si la primera carga falla,
// intentaremos nuevamente en 30 segundos.

const intervaloReintentoError =
    30 * 1000;


// Tiempo máximo que esperamos una imagen
// durante la precarga.

const tiempoMaximoPrecarga =
    20000;



// ======================================================
// 2. VARIABLES
// ======================================================

let currentIndex =
    0;


let slides =
    [];


let backgroundSlides =
    [];


let timerSlide =
    null;


let timerConsulta =
    null;


let consultaEnProceso =
    false;


let cargaInicialCompletada =
    false;


let firmaImagenesActual =
    "";


let imagenesPendientes =
    null;


let firmaPendiente =
    "";



// ======================================================
// 3. INDICADOR DE ESTADO
// ======================================================

function establecerEstado(
    estado,
    texto
) {


    const indicador =
        document.getElementById(
            "indicador-estado"
        );


    if (!indicador) {
        return;
    }


    indicador.className =
        "indicador-estado";


    if (estado === "ok") {

        indicador.classList.add(
            "estado-ok"
        );

    }


    else if (estado === "error") {

        indicador.classList.add(
            "estado-error"
        );

    }


    else {

        indicador.classList.add(
            "estado-consultando"
        );

    }


    indicador.title =
        texto || "";

}



// ======================================================
// 4. PROGRAMAR PRÓXIMA CONSULTA
//
// Usamos setTimeout en lugar de setInterval.
// Así nunca se acumulan consultas.
// ======================================================

function programarConsulta(
    milisegundos
) {


    clearTimeout(
        timerConsulta
    );


    timerConsulta =
        setTimeout(
            consultarImagenesGitHub,
            milisegundos
        );

}



// ======================================================
// 5. CONSULTAR GITHUB
// ======================================================

async function consultarImagenesGitHub() {


    if (consultaEnProceso) {

        return;

    }


    consultaEnProceso =
        true;


    establecerEstado(
        "consultando",
        "Consultando imágenes"
    );


    try {


        /*
            Agregamos un parámetro variable.

            No modifica la carpeta consultada,
            pero evita reutilizar accidentalmente
            una respuesta almacenada por determinados
            navegadores/intermediarios.
        */

        const marcaTiempo =
            Date.now();


        const apiURL =
            `https://api.github.com/repos/${usuarioGitHub}/${repositorioGitHub}/contents/${carpetaImagenes}?_=${marcaTiempo}`;


        const respuesta =
            await fetch(
                apiURL,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!respuesta.ok) {

            throw new Error(
                `GitHub respondió ${respuesta.status}`
            );

        }


        const archivos =
            await respuesta.json();


        if (!Array.isArray(archivos)) {

            throw new Error(
                "La respuesta de GitHub no contiene una lista de archivos."
            );

        }


        // ==================================================
        // FILTRAR IMÁGENES
        // ==================================================

        const imagenes =
            archivos
                .filter(
                    archivo =>

                        archivo.type === "file"

                        &&

                        /\.(png|jpg|jpeg|webp|gif)$/i
                            .test(archivo.name)
                )
                .sort(
                    (a, b) =>

                        a.name.localeCompare(
                            b.name,
                            "es",
                            {
                                numeric: true,
                                sensitivity: "base"
                            }
                        )
                );


        if (imagenes.length === 0) {

            throw new Error(
                "La carpeta no contiene imágenes."
            );

        }


        // ==================================================
        // CREAR FIRMA
        //
        // Nombre + SHA permite detectar:
        //
        // - archivo agregado
        // - archivo eliminado
        // - archivo reemplazado
        // ==================================================

        const nuevaFirma =
            imagenes
                .map(
                    archivo =>
                        `${archivo.name}:${archivo.sha}`
                )
                .join("|");



        // ==================================================
        // PRIMERA CARGA
        // ==================================================

        if (!cargaInicialCompletada) {


            const imagenesValidas =
                await precargarImagenes(
                    imagenes
                );


            if (
                imagenesValidas.length === 0
            ) {

                throw new Error(
                    "GitHub respondió, pero ninguna imagen pudo descargarse."
                );

            }


            const firmaValida =
                crearFirma(
                    imagenesValidas
                );


            aplicarNuevaLista(
                imagenesValidas,
                firmaValida
            );


            cargaInicialCompletada =
                true;


            establecerEstado(
                "ok",
                `${imagenesValidas.length} imágenes cargadas`
            );


            programarConsulta(
                intervaloConsultaNormal
            );


            return;

        }



        // ==================================================
        // SIN CAMBIOS
        // ==================================================

        if (
            nuevaFirma ===
            firmaImagenesActual
        ) {


            imagenesPendientes =
                null;


            firmaPendiente =
                "";


            establecerEstado(
                "ok",
                `${slides.length} imágenes activas`
            );


            programarConsulta(
                intervaloConsultaNormal
            );


            return;

        }



        // ==================================================
        // CAMBIO DETECTADO
        // ==================================================

        const imagenesValidas =
            await precargarImagenes(
                imagenes
            );


        if (
            imagenesValidas.length === 0
        ) {

            throw new Error(
                "Las nuevas imágenes no pudieron precargarse."
            );

        }


        const firmaValida =
            crearFirma(
                imagenesValidas
            );


        // Si después de validar resulta que
        // realmente no cambió nada...

        if (
            firmaValida ===
            firmaImagenesActual
        ) {


            establecerEstado(
                "ok",
                `${slides.length} imágenes activas`
            );


            programarConsulta(
                intervaloConsultaNormal
            );


            return;

        }


        // Guardamos la nueva lista.
        //
        // No interrumpimos inmediatamente
        // la imagen que está mostrándose.

        imagenesPendientes =
            imagenesValidas;


        firmaPendiente =
            firmaValida;


        establecerEstado(
            "ok",
            "Actualización lista para aplicar"
        );


        programarConsulta(
            intervaloConsultaNormal
        );


    }


    catch (error) {


        console.error(
            "Error consultando GitHub:",
            error
        );


        establecerEstado(
            "error",
            error.message
        );


        /*
            Si todavía no tenemos ninguna imagen,
            podemos mostrar el problema.

            Si el slideshow ya estaba funcionando,
            NO lo eliminamos.

            De esta manera una falla temporal
            no deja la TV en negro.
        */

        if (!cargaInicialCompletada) {

            mostrarMensaje(
                "Intentando cargar las imágenes..."
            );

        }


        // Intentar nuevamente.
        //
        // No usamos location.reload().

        programarConsulta(
            intervaloReintentoError
        );


    }


    finally {


        consultaEnProceso =
            false;


    }

}



// ======================================================
// 6. CREAR FIRMA
// ======================================================

function crearFirma(
    imagenes
) {


    return imagenes
        .map(
            archivo =>
                `${archivo.name}:${archivo.sha}`
        )
        .join("|");

}



// ======================================================
// 7. PRECARGAR IMÁGENES
//
// Antes de sustituir el slideshow comprobamos
// que las imágenes realmente puedan descargarse.
// ======================================================

async function precargarImagenes(
    imagenes
) {


    const resultados =
        await Promise.all(
            imagenes.map(
                precargarUnaImagen
            )
        );


    const imagenesValidas =
        resultados.filter(
            resultado =>
                resultado !== null
        );


    console.log(
        `Precarga: ${imagenesValidas.length} de ${imagenes.length} imágenes correctas`
    );


    return imagenesValidas;

}



// ======================================================
// 8. PRECARGAR UNA IMAGEN
// ======================================================

function precargarUnaImagen(
    archivo
) {


    return new Promise(
        resolve => {


            const imagen =
                new Image();


            let finalizado =
                false;


            const urlVersionada =
                construirUrlImagen(
                    archivo
                );


            const timeout =
                setTimeout(
                    function () {


                        if (finalizado) {
                            return;
                        }


                        finalizado =
                            true;


                        console.warn(
                            "Tiempo agotado cargando:",
                            archivo.name
                        );


                        resolve(
                            null
                        );


                    },
                    tiempoMaximoPrecarga
                );


            imagen.onload =
                function () {


                    if (finalizado) {
                        return;
                    }


                    finalizado =
                        true;


                    clearTimeout(
                        timeout
                    );


                    resolve(
                        archivo
                    );


                };


            imagen.onerror =
                function () {


                    if (finalizado) {
                        return;
                    }


                    finalizado =
                        true;


                    clearTimeout(
                        timeout
                    );


                    console.warn(
                        "No se pudo cargar:",
                        archivo.name
                    );


                    resolve(
                        null
                    );


                };


            imagen.src =
                urlVersionada;


        }
    );

}



// ======================================================
// 9. CONSTRUIR URL VERSIONADA
// ======================================================

function construirUrlImagen(
    archivo
) {


    /*
        Agregamos el SHA al URL.

        Si se reemplaza:

        Ejecucion.png

        conservando el mismo nombre,
        cambia el SHA y por lo tanto
        cambia también la URL.

        Esto ayuda a evitar mostrar
        una versión anterior en caché.
    */


    return (
        archivo.download_url
        +
        "?v="
        +
        encodeURIComponent(
            archivo.sha
        )
    );

}



// ======================================================
// 10. APLICAR NUEVA LISTA
// ======================================================

function aplicarNuevaLista(
    imagenes,
    nuevaFirma
) {


    if (
        !imagenes
        ||
        imagenes.length === 0
    ) {

        return;

    }


    clearTimeout(
        timerSlide
    );


    const contenedorPrincipal =
        document.getElementById(
            "slideshow"
        );


    const contenedorFondos =
        document.getElementById(
            "bg-ambientes"
        );


    if (
        !contenedorPrincipal
        ||
        !contenedorFondos
    ) {

        console.error(
            "No se encontraron los contenedores."
        );

        return;

    }


    // Creamos primero los nuevos elementos.
    //
    // Después sustituimos el contenido.

    const fragmentoSlides =
        document.createDocumentFragment();


    const fragmentoFondos =
        document.createDocumentFragment();



    imagenes.forEach(
        (archivo, index) => {


            const urlImagen =
                construirUrlImagen(
                    archivo
                );


            // ==========================================
            // IMAGEN PRINCIPAL
            // ==========================================

            const slide =
                document.createElement(
                    "img"
                );


            slide.className =
                "slide";


            slide.src =
                urlImagen;


            slide.alt =
                archivo.name;


            slide.dataset.nombre =
                archivo.name;


            slide.dataset.sha =
                archivo.sha;


            slide.dataset.tiempo =
                String(
                    tiempoPredeterminado
                );


            if (index === 0) {

                slide.classList.add(
                    "active"
                );

            }


            fragmentoSlides.appendChild(
                slide
            );



            // ==========================================
            // FONDO
            // ==========================================

            const fondo =
                document.createElement(
                    "img"
                );


            fondo.className =
                "slide-bg";


            fondo.src =
                urlImagen;


            fondo.alt =
                "";


            fondo.setAttribute(
                "aria-hidden",
                "true"
            );


            if (index === 0) {

                fondo.classList.add(
                    "active"
                );

            }


            fragmentoFondos.appendChild(
                fondo
            );


        }
    );


    contenedorPrincipal.replaceChildren(
        fragmentoSlides
    );


    contenedorFondos.replaceChildren(
        fragmentoFondos
    );


    slides =
        Array.from(
            document.querySelectorAll(
                "#slideshow .slide"
            )
        );


    backgroundSlides =
        Array.from(
            document.querySelectorAll(
                "#bg-ambientes .slide-bg"
            )
        );


    currentIndex =
        0;


    firmaImagenesActual =
        nuevaFirma;


    imagenesPendientes =
        null;


    firmaPendiente =
        "";


    console.log(
        "Slideshow actualizado:",
        slides.length,
        "imágenes"
    );


    programarSiguienteCambio();

}



// ======================================================
// 11. CAMBIAR SLIDE
// ======================================================

function changeSlide() {


    if (
        !slides
        ||
        slides.length === 0
    ) {

        return;

    }



    // ==================================================
    // UNA SOLA IMAGEN
    // ==================================================

    if (
        slides.length === 1
    ) {


        if (
            imagenesPendientes !== null
        ) {


            aplicarNuevaLista(
                imagenesPendientes,
                firmaPendiente
            );


            return;

        }


        programarSiguienteCambio();


        return;

    }



    // ==================================================
    // CALCULAR SIGUIENTE
    // ==================================================

    const siguienteIndice =
        (currentIndex + 1)
        %
        slides.length;


    const vueltaTerminada =
        siguienteIndice === 0;



    // ==================================================
    // SI TERMINÓ LA VUELTA Y EXISTE ACTUALIZACIÓN
    // ==================================================

    if (
        vueltaTerminada
        &&
        imagenesPendientes !== null
    ) {


        aplicarNuevaLista(
            imagenesPendientes,
            firmaPendiente
        );


        return;

    }



    // ==================================================
    // DESACTIVAR ACTUAL
    // ==================================================

    if (
        slides[currentIndex]
    ) {

        slides[currentIndex]
            .classList.remove(
                "active"
            );

    }


    if (
        backgroundSlides[currentIndex]
    ) {

        backgroundSlides[currentIndex]
            .classList.remove(
                "active"
            );

    }



    currentIndex =
        siguienteIndice;



    // ==================================================
    // ACTIVAR SIGUIENTE
    // ==================================================

    if (
        slides[currentIndex]
    ) {

        slides[currentIndex]
            .classList.add(
                "active"
            );

    }


    if (
        backgroundSlides[currentIndex]
    ) {

        backgroundSlides[currentIndex]
            .classList.add(
                "active"
            );

    }



    programarSiguienteCambio();

}



// ======================================================
// 12. PROGRAMAR SIGUIENTE SLIDE
// ======================================================

function programarSiguienteCambio() {


    if (
        !slides
        ||
        slides.length === 0
    ) {

        clearTimeout(
            timerSlide
        );

        return;

    }


    const tiempoActual =

        parseInt(
            slides[currentIndex]
                .dataset
                .tiempo,
            10
        )

        ||

        tiempoPredeterminado;


    clearTimeout(
        timerSlide
    );


    timerSlide =
        setTimeout(
            changeSlide,
            tiempoActual
        );

}



// ======================================================
// 13. MOSTRAR MENSAJE
// ======================================================

function mostrarMensaje(
    mensaje
) {


    const contenedor =
        document.getElementById(
            "slideshow"
        );


    if (!contenedor) {

        return;

    }


    contenedor.innerHTML =
        `<div class="mensaje-estado">${mensaje}</div>`;

}



// ======================================================
// 14. RELOJ Y FECHA
// ======================================================

function actualizarTiempo() {


    const ahora =
        new Date();


    // ==================================================
    // HORA
    // ==================================================

    const opcionesReloj = {

        hour:
            "numeric",

        minute:
            "2-digit",

        hour12:
            true

    };


    let hora12 =
        ahora.toLocaleTimeString(
            "es-CR",
            opcionesReloj
        );


    hora12 =
        hora12
            .replace(/\./g, "")
            .replace(/[a-zA-Z]/g, "")
            .trim();


    const reloj =
        document.getElementById(
            "reloj"
        );


    if (reloj) {

        reloj.textContent =
            hora12;

    }



    // ==================================================
    // FECHA
    // ==================================================

    const opcionesFecha = {

        weekday:
            "long",

        day:
            "numeric",

        month:
            "long"

    };


    let fechaTexto =
        ahora.toLocaleDateString(
            "es-ES",
            opcionesFecha
        );


    fechaTexto =

        fechaTexto
            .charAt(0)
            .toUpperCase()

        +

        fechaTexto
            .slice(1);


    const fecha =
        document.getElementById(
            "fecha"
        );


    if (fecha) {

        fecha.textContent =
            fechaTexto;

    }



    // ==================================================
    // MODO ECO
    // ==================================================

    const horaActual =
        ahora.getHours();


    if (
        horaActual < 7
        ||
        horaActual >= 16
    ) {

        document.body
            .classList
            .add(
                "modo-eco"
            );

    }

    else {

        document.body
            .classList
            .remove(
                "modo-eco"
            );

    }

}



// ======================================================
// 15. PIXEL SHIFT
// ======================================================

function ejecutarPixelShift() {


    const barra =
        document.getElementById(
            "barra-institucional"
        );


    if (!barra) {

        return;

    }


    const desvioTop =

        Math.floor(
            Math.random() * 5
        )

        - 2;


    const desvioLeft =

        Math.floor(
            Math.random() * 5
        )

        - 2;


    barra.style.top =
        desvioTop + "px";


    barra.style.left =
        desvioLeft + "px";

}



// ======================================================
// 16. INICIALIZACIÓN
// ======================================================


// Reloj desde el inicio.

actualizarTiempo();


// Primera consulta a GitHub.

setInterval(

);
