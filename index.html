<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporativa DABS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
        }
        
        .pantalla-completa {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            padding: 20px;
            gap: 15px;
            position: relative;
            z-index: 5;
        }

        /* MARCO SUPERIOR: Cristal Ultra Traslúcido Corregido */
        .marco-superior {
            width: 100%;
            height: 15vh;
            /* CORRECCIÓN: Fondo más transparente (0.15) y mayor desenfoque (25px) */
            background: rgba(13, 17, 23, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            position: relative;
            top: 0; left: 0;
            transition: top 0.5s ease, left 0.5s ease, opacity 1s ease, filter 1s ease;
        }

        .contenedor-logo {
            height: 80%;
            display: flex;
            align-items: center;
        }
        
        .logo-ccss {
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.15));
        }

        .bloque-titulos {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 0 20px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8); /* Sombra de texto reforzada para lectura ultra clara */
        }

        .texto-institucion-gerencia {
            color: #60a5fa; 
            font-size: 1.1vw;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .texto-direccion {
            color: #e2e8f0; 
            font-size: 1.9vw;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-align: center;
        }

        .tiempo-contenedor {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            min-width: 220px;
        }

        .reloj {
            color: #cbd5e1; 
            font-size: 2.4vw;
            font-weight: 700;
            font-family: 'Segoe UI', sans-serif;
            text-shadow: 0 0 8px rgba(224, 242, 254, 0.2), 0 2px 4px rgba(0,0,0,0.6);
            line-height: 1;
            margin-bottom: 4px;
            letter-spacing: -1px;
        }

        .fecha {
            color: #94a3b8; 
            font-size: 1.1vw;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        .slideshow-container { 
            width: 100%;
            height: 79vh;
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }
        
        img.slide { 
            position: absolute;
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            opacity: 0; 
            z-index: 2;
            transform: scale(0.97);
            transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out; 
        }
        
        img.slide.active { 
            opacity: 1; 
            transform: scale(1);
        }

        .background-ambientes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
            transition: filter 1s ease;
        }

        img.slide-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            filter: blur(60px) brightness(0.4) saturate(1.4); 
            transition: opacity 1.2s ease-in-out;
        }

        img.slide-bg.active {
            opacity: 1;
        }

        /* MODO PROTECCIÓN NOCTURNO (4:00 PM) */
        .modo-eco .marco-superior {
            opacity: 0.3; /* Un poco más oscuro de noche para proteger el panel */
            background: rgba(13, 17, 23, 0.3);
            filter: grayscale(0.5);
        }
        .modo-eco .background-ambientes {
            filter: brightness(0.1); 
        }
    </style>
</head>
<body>

    <div class="background-ambientes" id="bg-ambientes">
        <img class="slide-bg active" src="85aniversario.webp">
        <img class="slide-bg" src="foto1.jpg">
        <img class="slide-bg" src="foto2.jpg">
        <img class="slide-bg" src="foto3.jpg">
        <img class="slide-bg" src="foto4.jpg">
        <img class="slide-bg" src="foto5.jpg">
        <img class="slide-bg" src="foto6.jpg">
    </div>

    <div class="pantalla-completa" id="contenedor-principal">

        <header class="marco-superior" id="barra-institucional">
            <div class="contenedor-logo">
                <img class="logo-ccss" src="logo-ccss.png" alt="Logo CCSS">
            </div>
            
            <div class="bloque-titulos">
                <h2 class="texto-institucion-gerencia">Caja Costarricense de Seguro Social - Gerencia de Logística</h2>
                <h1 class="texto-direccion">Dirección de Aprovisionamiento de Bienes y Servicios</h1>
            </div>
            
            <div class="tiempo-contenedor">
                <div class="reloj" id="reloj">00:00</div>
                <div class="fecha" id="fecha">Cargando...</div>
            </div>
        </header>

        <main class="slideshow-container">
            <img class="slide active" src="85aniversario.webp" data-tiempo="3000"> 
            <img class="slide" src="foto1.jpg" data-tiempo="8000">
            <img class="slide" src="foto2.jpg" data-tiempo="8000">
            <img class="slide" src="foto3.jpg" data-tiempo="8000">
            <img class="slide" src="foto4.jpg" data-tiempo="8000">
            <img class="slide" src="foto5.jpg" data-tiempo="8000">
            <img class="slide" src="foto6.jpg" data-tiempo="8000">
        </main>

    </div>

<script>
    // 1. CONTROL DEL SLIDESHOW
    let currentIndex = 0;
    const slides = document.querySelectorAll('.slide');
    const backgroundSlides = document.querySelectorAll('.slide-bg');
    let timerID = null;

    function changeSlide() {
        if (slides.length > 1) {
            slides[currentIndex].classList.remove('active');
            backgroundSlides[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add('active');
            backgroundSlides[currentIndex].classList.add('active');
        }
        programarSiguienteCambio();
    }

    function programarSiguienteCambio() {
        const tiempoActual = parseInt(slides[currentIndex].getAttribute('data-tiempo')) || 8000;
        clearTimeout(timerID);
        timerID = setTimeout(changeSlide, tiempoActual);
    }
    programarSiguienteCambio();

    // 2. RELOJ 12H SIN AM/PM Y FECHA FORMATEADA CORRECTAMENTE
    function actualizarTiempo() {
        const ahora = new Date();
        
        const opcionesReloj = { hour: 'numeric', minute: '2-digit', hour12: true };
        let hora12 = ahora.toLocaleTimeString('es-CR', opcionesReloj);
        hora12 = hora12.replace(/\./g, '').replace(/[a-zA-Z]/g, '').trim();
        document.getElementById('reloj').textContent = hora12;
        
        const opcionesFecha = { weekday: 'long', day: 'numeric', month: 'long' };
        let fechaTexto = ahora.toLocaleDateString('es-ES', opcionesFecha);
        fechaTexto = fechaTexto.charAt(0).toUpperCase() + fechaTexto.slice(1);
        document.getElementById('fecha').textContent = fechaTexto;

        // MODO ECO (4:00 PM)
        const horaActual = ahora.getHours();
        const cuerpo = document.body;
        if (horaActual < 7 || horaActual >= 16) {
            cuerpo.classList.add('modo-eco');
        } else {
            cuerpo.classList.remove('modo-eco');
        }
    }
    setInterval(actualizarTiempo, 15000); 
    actualizarTiempo();

    // 3. PIXEL-SHIFT ANTI QUEMADO (Cada 1 minuto)
    function ejecutarPixelShift() {
        const barra = document.getElementById('barra-institucional');
        const desvíoTop = Math.floor(Math.random() * 5) - 2;
        const desvíoLeft = Math.floor(Math.random() * 5) - 2;
        
        barra.style.top = desvíoTop + 'px';
        barra.style.left = desvíoLeft + 'px';
    }
    setInterval(ejecutarPixelShift, 60000); 

    // 4. AUTOREFRESCO DE PRUEBAS (Cada 2 minutos)
    setTimeout(function() { 
        location.reload(); 
    }, 120000); 
</script>

</body>
</html>
