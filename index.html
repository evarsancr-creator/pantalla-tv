<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pantalla Corporativa DABS</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                Arial,
                sans-serif;

            background-color: #0d1117;
        }


        /* =====================================================
           CONTENEDOR GENERAL
        ===================================================== */

        .pantalla-completa {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;

            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;

            width: 100%;
            height: 100%;

            padding: 20px;

            position: relative;
            z-index: 5;
        }


        /* =====================================================
           ENCABEZADO
        ===================================================== */

        .marco-superior {
            width: 100%;
            height: 15%;

            margin-bottom: 15px;

            background:
                rgba(13, 17, 23, 0.65);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 16px;

            display: -webkit-box;
            display: -webkit-flex;
            display: flex;

            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;

            -webkit-box-pack: justify;
            -webkit-justify-content: space-between;
            justify-content: space-between;

            padding: 0 30px;

            box-shadow:
                0 8px 32px
                rgba(0, 0, 0, 0.4);

            position: relative;

            top: 0;
            left: 0;

            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);

            -webkit-transition:
                top 0.5s ease,
                left 0.5s ease,
                opacity 1s ease;

            transition:
                top 0.5s ease,
                left 0.5s ease,
                opacity 1s ease;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .contenedor-logo {
            height: 80%;

            display: -webkit-box;
            display: -webkit-flex;
            display: flex;

            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
        }

        .logo-ccss {
            height: 100%;
            max-width: 230px;

            object-fit: contain;

            -webkit-filter:
                drop-shadow(
                    0 0 8px
                    rgba(255, 255, 255, 0.15)
                );

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(255, 255, 255, 0.15)
                );
        }


        /* =====================================================
           TÍTULOS
        ===================================================== */

        .bloque-titulos {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;

            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;

            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;

            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;

            -webkit-box-flex: 1;
            -webkit-flex-grow: 1;
            flex-grow: 1;

            padding: 0 20px;

            text-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.8);
        }

        .texto-institucion-gerencia {
            color: #60a5fa;

            font-size: 1.1vw;
            font-weight: 600;

            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;

            margin-bottom: 2px;
        }

        .texto-direccion {
            color: #e2e8f0;

            font-size: 1.9vw;
            font-weight: 700;

            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-align: center;
        }


        /* =====================================================
           RELOJ
        ===================================================== */

        .tiempo-contenedor {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;

            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;

            -webkit-box-align: end;
            -webkit-align-items: flex-end;
            align-items: flex-end;

            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;

            min-width: 220px;
        }

        .reloj {
            color: #cbd5e1;

            font-size: 2.4vw;
            font-weight: 700;

            line-height: 1;
            margin-bottom: 4px;

            text-shadow:
                0 0 8px rgba(224, 242, 254, 0.2),
                0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .fecha {
            color: #94a3b8;

            font-size: 1.1vw;
            font-weight: 500;

            letter-spacing: 0.5px;

            text-shadow:
                0 1px 3px
                rgba(0, 0, 0, 0.6);
        }


        /* =====================================================
           SLIDESHOW
        ===================================================== */

        .slideshow-container {
            width: 100%;

            -webkit-box-flex: 1;
            -webkit-flex: 1;
            flex: 1;

            position: relative;

            display: -webkit-box;
            display: -webkit-flex;
            display: flex;

            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;

            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;

            background-color:
                rgba(0, 0, 0, 0.25);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, 0.6);
        }


        /* =====================================================
           IMAGEN PRINCIPAL
        ===================================================== */

        .slide {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;
            object-position: center center;

            opacity: 0;
            visibility: hidden;

            z-index: 2;

            -webkit-transform: scale(0.98);
            transform: scale(0.98);

            -webkit-transition:
                opacity 1.2s ease-in-out,
                -webkit-transform 1.2s ease-in-out;

            transition:
                opacity 1.2s ease-in-out,
                transform 1.2s ease-in-out;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;

            -webkit-transform: scale(1);
            transform: scale(1);
        }


        /* =====================================================
           FONDO AMBIENTE
        ===================================================== */

        .background-ambientes {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 1;

            overflow: hidden;

            background-color: #0d1117;
        }

        .slide-bg {
            position: absolute;

            top: -5%;
            left: -5%;

            width: 110%;
            height: 110%;

            object-fit: cover;

            opacity: 0;
            visibility: hidden;

            -webkit-filter:
                blur(60px)
                brightness(0.4)
                saturate(1.4);

            filter:
                blur(60px)
                brightness(0.4)
                saturate(1.4);

            -webkit-transform: scale(1.08);
            transform: scale(1.08);

            -webkit-transition:
                opacity 1.2s ease-in-out;

            transition:
                opacity 1.2s ease-in-out;
        }

        .slide-bg.active {
            opacity: 1;
            visibility: visible;
        }


        /* =====================================================
           MENSAJE
        ===================================================== */

        .mensaje-estado {
            position: relative;
            z-index: 10;

            color: #cbd5e1;

            font-size: 22px;
            font-weight: 500;

            text-align: center;

            padding: 30px;
        }


        /* =====================================================
           INDICADOR DE ESTADO
        ===================================================== */

        .indicador-estado {
            position: fixed;

            right: 8px;
            bottom: 8px;

            width: 11px;
            height: 11px;

            border-radius: 50%;

            background-color: #64748b;

            z-index: 100;

            opacity: 0.75;

            cursor: pointer;
        }

        .estado-ok {
            background-color: #22c55e;
        }

        .estado-consultando {
            background-color: #f59e0b;
        }

        .estado-error {
            background-color: #ef4444;
        }


        /* =====================================================
           PANEL DE DIAGNÓSTICO
        ===================================================== */

        .panel-diagnostico {
            position: fixed;

            right: 15px;
            bottom: 28px;

            width: 370px;

            display: none;

            z-index: 200;

            padding: 15px;

            color: #e2e8f0;

            background-color:
                rgba(13, 17, 23, 0.97);

            border:
                1px solid rgba(255, 255, 255, 0.20);

            border-radius: 10px;

            font-size: 14px;
            line-height: 1.6;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.60);
        }

        .panel-diagnostico.visible {
            display: block;
        }

        .diagnostico-titulo {
            margin-bottom: 8px;

            color: #60a5fa;

            font-weight: 700;
            font-size: 16px;
        }


        /* =====================================================
           MODO ECO
        ===================================================== */

        .modo-eco .marco-superior {
            opacity: 0.35;

            background:
                rgba(13, 17, 23, 0.80);
        }

        .modo-eco .background-ambientes {
            -webkit-filter:
                brightness(0.20);

            filter:
                brightness(0.20);
        }


        /* =====================================================
           RESOLUCIONES MENORES
        ===================================================== */

        @media screen and (max-width: 900px) {

            .pantalla-completa {
                padding: 10px;
            }

            .marco-superior {
                padding: 0 15px;
                margin-bottom: 10px;
            }

            .tiempo-contenedor {
                min-width: 140px;
            }

            .panel-diagnostico {
                width: 300px;
            }

        }

    </style>

</head>


<body>


    <div

    </div>


    <div

        <div

            id="barra-institucional">


            <div class="contenedor-logo">

                <img
                    class="logo-ccss"
                    src="logo-ccss.png"

                >

            </div>


            <div class="bloque-titulos">

                <div class="texto-institucion-gerencia">

                    Caja Costarricense de Seguro Social -
                    Gerencia de Logística

                </div>

    <div

    <div

        class="panel-diagnostico">

        <div class="diagnostico-titulo">
            Diagnóstico de pantalla
        </div>

        <div id="diagnostico-contenido">
            Inicializando...
        </div>

    </div>



<script type="text/javascript">


/*
=========================================================
VERSIÓN COMPATIBLE CON LG WEBOS ANTIGUO
=========================================================

Mantiene:

- api.github.com
- archivo.download_url
- detección mediante nombre + SHA
- actualización sin refrescar la página
- imágenes ampliadas con object-fit: contain

No utiliza:

- fetch()
- async / await
- Promise
- const / let
- funciones flecha
- template strings
- replaceChildren()
- Array.from()
- classList
- location.reload()

=========================================================
*/


// ======================================================
// 1. CONFIGURACIÓN
// ======================================================

var usuarioGitHub =
    "evarsancr-creator";

var repositorioGitHub =
    "pantalla-tv";

var carpetaImagenes =
    "imagenes";


// Duración de cada imagen: 8 segundos.

var tiempoPredeterminado =
    8000;


// Consultar GitHub cada 5 minutos.

var intervaloConsultaNormal =
    5 * 60 * 1000;


// Si ocurre un error, reintentar en 30 segundos.

var intervaloReintentoError =
    30 * 1000;


// Máximo de espera por cada imagen: 20 segundos.

var tiempoMaximoImagen =
    20000;



// ======================================================
// 2. VARIABLES
// ======================================================

var currentIndex =
    0;

var slides =
    [];

var backgroundSlides =
    [];

var timerSlide =
    null;

var timerConsulta =
    null;

var consultaEnProceso =
    false;

var cargaInicialCompletada =
    false;

var firmaImagenesActual =
    "";

var imagenesPendientes =
    null;

var firmaPendiente =
    "";

var estadoDiagnostico = {

    api:
        "Pendiente",

    archivosDetectados:
        0,

    imagenesValidas:
        0,

    imagenesConError:
        0,

    ultimoError:
        "Ninguno",

    ultimaConsulta:
        "Sin consulta"

};



// ======================================================
// 3. EVENTOS COMPATIBLES
// ======================================================

function agregarEvento(
    elemento,
    evento,
    funcion
) {

    if (!elemento) {
        return;
    }

    if (elemento.addEventListener) {

        elemento.addEventListener(
            evento,
            funcion,
            false
        );

    }

    else if (elemento.attachEvent) {

        elemento.attachEvent(
            "on" + evento,
            funcion
        );

    }

    else {

        elemento[
            "on" + evento
        ] = funcion;

    }

}



// ======================================================
// 4. AGREGAR CLASE
// ======================================================

function agregarClase(
    elemento,
    nombreClase
) {

    if (!elemento) {
        return;
    }

    var clases =
        " " + elemento.className + " ";

    if (
        clases.indexOf(
            " " + nombreClase + " "
        ) === -1
    ) {

        elemento.className =
            elemento.className
            +
            " "
            +
            nombreClase;

    }

}



// ======================================================
// 5. QUITAR CLASE
// ======================================================

function quitarClase(
    elemento,
    nombreClase
) {

    if (!elemento) {
        return;
    }

    var expresion =
        new RegExp(
            "(^|\\s)"
            +
            nombreClase
            +
            "(\\s|$)",
            "g"
        );

    elemento.className =
        elemento.className
            .replace(
                expresion,
                " "
            )
            .replace(
                /^\s+|\s+$/g,
                ""
            );

}



// ======================================================
// 6. ESTABLECER TEXTO
// ======================================================

function establecerTexto(
    elemento,
    texto
) {

    if (!elemento) {
        return;
    }

    if (
        typeof elemento.textContent !==
        "undefined"
    ) {

        elemento.textContent =
            texto;

    }

    else {

        elemento.innerText =
            texto;

    }

}



// ======================================================
// 7. ESCAPAR TEXTO PARA DIAGNÓSTICO
// ======================================================

function escaparHTML(
    texto
) {

    if (
        texto === null
        ||
        typeof texto === "undefined"
    ) {

        return "";

    }

    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



// ======================================================
// 8. INDICADOR
// ======================================================

function establecerEstado(
    estado,
    texto
) {

    var indicador =
        document.getElementById(
            "indicador-estado"
        );

    if (!indicador) {
        return;
    }

    indicador.className =
        "indicador-estado";

    if (estado === "ok") {

        agregarClase(
            indicador,
            "estado-ok"
        );

    }

    else if (estado === "error") {

        agregarClase(
            indicador,
            "estado-error"
        );

    }

    else {

        agregarClase(
            indicador,
            "estado-consultando"
        );

    }

    indicador.title =
        texto || "";

    actualizarPanelDiagnostico();

}



// ======================================================
// 9. PANEL DE DIAGNÓSTICO
// ======================================================

function actualizarPanelDiagnostico() {

    var contenido =
        document.getElementById(
            "diagnostico-contenido"
        );

    if (!contenido) {
        return;
    }

    contenido.innerHTML =

        "<strong>API GitHub:</strong> "
        + escaparHTML(
            estadoDiagnostico.api
        )

        + "<br>"

        + "<strong>Archivos detectados:</strong> "
        + estadoDiagnostico.archivosDetectados

        + "<br>"

        + "<strong>Imágenes cargadas:</strong> "
        + estadoDiagnostico.imagenesValidas

        + "<br>"

        + "<strong>Imágenes con error:</strong> "
        + estadoDiagnostico.imagenesConError

        + "<br>"

        + "<strong>Última consulta:</strong> "
        + escaparHTML(
            estadoDiagnostico.ultimaConsulta
        )

        + "<br>"

        + "<strong>Último error:</strong> "
        + escaparHTML(
            estadoDiagnostico.ultimoError
        );

}



function alternarPanelDiagnostico() {

    var panel =
        document.getElementById(
            "panel-diagnostico"
        );

    if (!panel) {
        return;
    }

    if (
        (
            " " + panel.className + " "
        ).indexOf(
            " visible "
        ) >= 0
    ) {

        quitarClase(
            panel,
            "visible"
        );

    }

    else {

        agregarClase(
            panel,
            "visible"
        );

    }

}



// ======================================================
// 10. HORA DE DIAGNÓSTICO
// ======================================================

function obtenerHoraDiagnostico() {

    var ahora =
        new Date();

    var horas =
        ahora.getHours();

    var minutos =
        ahora.getMinutes();

    var segundos =
        ahora.getSeconds();

    if (minutos < 10) {
        minutos = "0" + minutos;
    }

    if (segundos < 10) {
        segundos = "0" + segundos;
    }

    return (
        horas
        + ":"
        + minutos
        + ":"
        + segundos
    );

}



// ======================================================
// 11. PROGRAMAR CONSULTA
// ======================================================

function programarConsulta(
    milisegundos
) {

    if (timerConsulta !== null) {

        clearTimeout(
            timerConsulta
        );

    }

    timerConsulta =
        setTimeout(
            function () {

                consultarImagenesGitHub();

            },
            milisegundos
        );

}



// ======================================================
// 12. CREAR SOLICITUD HTTP
// ======================================================

function crearSolicitudHTTP() {

    var solicitud =
        null;

    if (
        typeof XMLHttpRequest !==
        "undefined"
    ) {

        solicitud =
            new XMLHttpRequest();

    }

    else {

        try {

            solicitud =
                new ActiveXObject(
                    "Msxml2.XMLHTTP"
                );

        }

        catch (errorUno) {

            try {

                solicitud =
                    new ActiveXObject(
                        "Microsoft.XMLHTTP"
                    );

            }

            catch (errorDos) {

                solicitud =
                    null;

            }

        }

    }

    return solicitud;

}



// ======================================================
// 13. CONSULTAR GITHUB
// ======================================================

function consultarImagenesGitHub() {

    if (consultaEnProceso) {
        return;
    }

    consultaEnProceso =
        true;

    estadoDiagnostico.ultimaConsulta =
        obtenerHoraDiagnostico();

    estadoDiagnostico.ultimoError =
        "Ninguno";

    establecerEstado(
        "consultando",
        "Consultando GitHub"
    );

    var solicitud =
        crearSolicitudHTTP();

    if (!solicitud) {

        finalizarConsultaConError(
            "El navegador no admite solicitudes HTTP."
        );

        return;

    }

    /*
        Conservamos la misma URL de API
        que funcionó en la versión moderna.
    */

    var apiURL =

        "https://api.github.com/repos/"
        +
        usuarioGitHub
        +
        "/"
        +
        repositorioGitHub
        +
        "/contents/"
        +
        carpetaImagenes;


    solicitud.onreadystatechange =
        function () {

            if (
                solicitud.readyState !== 4
            ) {

                return;

            }

            if (
                solicitud.status >= 200
                &&
                solicitud.status < 300
            ) {

                procesarRespuestaGitHub(
                    solicitud.responseText
                );

            }

            else {

                finalizarConsultaConError(
                    "GitHub respondió con estado "
                    +
                    solicitud.status
                );

            }

        };


    solicitud.onerror =
        function () {

            finalizarConsultaConError(
                "Error de conexión con GitHub."
            );

        };


    solicitud.ontimeout =
        function () {

            finalizarConsultaConError(
                "La consulta a GitHub agotó el tiempo."
            );

        };


    try {

        solicitud.open(
            "GET",
            apiURL,
            true
        );

        try {

            solicitud.timeout =
                25000;

        }

        catch (errorTimeout) {
        }

        solicitud.send(
            null
        );

    }

    catch (errorSolicitud) {

        finalizarConsultaConError(
            "No se pudo iniciar la consulta: "
            +
            errorSolicitud.message
        );

    }

}



// ======================================================
// 14. PROCESAR RESPUESTA
// ======================================================

function procesarRespuestaGitHub(
    textoRespuesta
) {

    var archivos;

    try {

        archivos =
            JSON.parse(
                textoRespuesta
            );

    }

    catch (errorJSON) {

        finalizarConsultaConError(
            "No fue posible interpretar la respuesta de GitHub."
        );

        return;

    }

    if (
        !archivos
        ||
        typeof archivos.length ===
        "undefined"
    ) {

        finalizarConsultaConError(
            "GitHub no devolvió una lista de archivos."
        );

        return;

    }

    estadoDiagnostico.api =
        "Correcta";

    var imagenes =
        [];

    var indice;

    for (
        indice = 0;
        indice < archivos.length;
        indice++
    ) {

        var archivo =
            archivos[indice];

        if (
            archivo
            &&
            archivo.type === "file"
            &&
            esArchivoImagen(
                archivo.name
            )
        ) {

            imagenes.push(
                archivo
            );

        }

    }

    ordenarImagenes(
        imagenes
    );

    estadoDiagnostico.archivosDetectados =
        imagenes.length;

    if (
        imagenes.length === 0
    ) {

        finalizarConsultaConError(
            "No se encontraron imágenes compatibles."
        );

        return;

    }

    var nuevaFirma =
        crearFirma(
            imagenes
        );


    /*
        Si ya está funcionando y no cambió la lista,
        no volvemos a descargar las imágenes.
    */

    if (
        cargaInicialCompletada
        &&
        nuevaFirma === firmaImagenesActual
    ) {

        consultaEnProceso =
            false;

        imagenesPendientes =
            null;

        firmaPendiente =
            "";

        estadoDiagnostico.imagenesValidas =
            slides.length;

        estadoDiagnostico.imagenesConError =
            0;

        establecerEstado(
            "ok",
            slides.length
            +
            " imágenes activas"
        );

        programarConsulta(
            intervaloConsultaNormal
        );

        return;

    }


    /*
        Precarga secuencial para no utilizar Promise.
    */

    precargarImagenesSecuencialmente(
        imagenes,
        0,
        [],
        nuevaFirma
    );

}



// ======================================================
// 15. VALIDAR EXTENSIÓN
// ======================================================

function esArchivoImagen(
    nombre
) {

    if (!nombre) {
        return false;
    }

    return (
        /\.(png|jpg|jpeg|webp|gif)$/i
    ).test(
        nombre
    );

}



// ======================================================
// 16. ORDENAR IMÁGENES
// ======================================================

function ordenarImagenes(
    imagenes
) {

    imagenes.sort(
        function (
            archivoA,
            archivoB
        ) {

            var nombreA =
                String(
                    archivoA.name
                ).toLowerCase();

            var nombreB =
                String(
                    archivoB.name
                ).toLowerCase();

            if (nombreA < nombreB) {
                return -1;
            }

            if (nombreA > nombreB) {
                return 1;
            }

            return 0;

        }
    );

}



// ======================================================
// 17. CREAR FIRMA
// ======================================================

function crearFirma(
    imagenes
) {

    var partes =
        [];

    var indice;

    for (
        indice = 0;
        indice < imagenes.length;
        indice++
    ) {

        partes.push(

            imagenes[indice].name
            +
            ":"
            +
            imagenes[indice].sha

        );

    }

    return partes.join(
        "|"
    );

}



// ======================================================
// 18. CONSTRUIR URL
//
// IMPORTANTE:
//
// Se conserva archivo.download_url.
// No se cambia a una ruta relativa.
// ======================================================

function construirUrlImagen(
    archivo
) {

    return (

        archivo.download_url

        +

        "?v="

        +

        encodeURIComponent(
            archivo.sha
        )

    );

}



// ======================================================
// 19. PRECARGAR SECUENCIALMENTE
// ======================================================

function precargarImagenesSecuencialmente(
    imagenes,
    posicion,
    imagenesValidas,
    firmaOriginal
) {

    if (
        posicion >= imagenes.length
    ) {

        procesarResultadoPrecarga(
            imagenes,
            imagenesValidas,
            firmaOriginal
        );

        return;

    }

    var archivo =
        imagenes[posicion];

    precargarUnaImagen(
        archivo,
        function (
            resultado
        ) {

            if (resultado) {

                imagenesValidas.push(
                    archivo
                );

            }

            precargarImagenesSecuencialmente(
                imagenes,
                posicion + 1,
                imagenesValidas,
                firmaOriginal
            );

        }
    );

}



// ======================================================
// 20. PRECARGAR UNA IMAGEN
// ======================================================

function precargarUnaImagen(
    archivo,
    callback
) {

    var imagen =
        new Image();

    var terminado =
        false;

    var urlImagen =
        construirUrlImagen(
            archivo
        );

    var temporizador =
        setTimeout(
            function () {

                if (terminado) {
                    return;
                }

                terminado =
                    true;

                callback(
                    false
                );

            },
            tiempoMaximoImagen
        );


    imagen.onload =
        function () {

            if (terminado) {
                return;
            }

            terminado =
                true;

            clearTimeout(
                temporizador
            );

            callback(
                true
            );

        };


    imagen.onerror =
        function () {

            if (terminado) {
                return;
            }

            terminado =
                true;

            clearTimeout(
                temporizador
            );

            callback(
                false
            );

        };


    imagen.src =
        urlImagen;

}



// ======================================================
// 21. PROCESAR PRECARGA
// ======================================================

function procesarResultadoPrecarga(
    imagenesOriginales,
    imagenesValidas,
    firmaOriginal
) {

    consultaEnProceso =
        false;

    estadoDiagnostico.imagenesValidas =
        imagenesValidas.length;

    estadoDiagnostico.imagenesConError =
        imagenesOriginales.length
        -
        imagenesValidas.length;

    if (
        imagenesValidas.length === 0
    ) {

        finalizarConsultaConError(
            "La API respondió, pero ninguna imagen pudo descargarse."
        );

        return;

    }

    var firmaValida =
        crearFirma(
            imagenesValidas
        );


    /*
        Primera carga.
    */

    if (
        !cargaInicialCompletada
    ) {

        aplicarNuevaLista(
            imagenesValidas,
            firmaValida
        );

        cargaInicialCompletada =
            true;

        if (
            estadoDiagnostico.imagenesConError > 0
        ) {

            estadoDiagnostico.ultimoError =
                "Algunas imágenes no pudieron cargarse.";

        }

        else {

            estadoDiagnostico.ultimoError =
                "Ninguno";

        }

        establecerEstado(
            "ok",
            imagenesValidas.length
            +
            " imágenes cargadas"
        );

        programarConsulta(
            intervaloConsultaNormal
        );

        return;

    }


    /*
        Si las imágenes válidas son iguales
        a las que ya están mostrándose.
    */

    if (
        firmaValida === firmaImagenesActual
    ) {

        imagenesPendientes =
            null;

        firmaPendiente =
            "";

        establecerEstado(
            "ok",
            slides.length
            +
            " imágenes activas"
        );

        programarConsulta(
            intervaloConsultaNormal
        );

        return;

    }


    /*
        Guardamos actualización pendiente.
        No interrumpimos la imagen actual.
    */

    imagenesPendientes =
        imagenesValidas;

    firmaPendiente =
        firmaValida;

    establecerEstado(
        "ok",
        "Actualización pendiente"
    );

    programarConsulta(
        intervaloConsultaNormal
    );

}



// ======================================================
// 22. ERROR
// ======================================================

function finalizarConsultaConError(
    mensaje
) {

    consultaEnProceso =
        false;

    estadoDiagnostico.ultimoError =
        mensaje;

    establecerEstado(
        "error",
        mensaje
    );

    /*
        Si todavía no hay slideshow,
        mostramos mensaje.

        Si el slideshow ya estaba funcionando,
        conservamos las imágenes actuales.
    */

    if (
        !cargaInicialCompletada
    ) {

        mostrarMensaje(
            "Intentando cargar las imágenes..."
        );

    }

    programarConsulta(
        intervaloReintentoError
    );

}



// ======================================================
// 23. APLICAR LISTA
// ======================================================

function aplicarNuevaLista(
    imagenes,
    nuevaFirma
) {

    if (
        !imagenes
        ||
        imagenes.length === 0
    ) {

        return;

    }

    if (timerSlide !== null) {

        clearTimeout(
            timerSlide
        );

    }

    var contenedorPrincipal =
        document.getElementById(
            "slideshow"
        );

    var contenedorFondos =
        document.getElementById(
            "bg-ambientes"
        );

    if (
        !contenedorPrincipal
        ||
        !contenedorFondos
    ) {

        finalizarConsultaConError(
            "No se encontraron los contenedores del slideshow."
        );

        return;

    }

    var fragmentoSlides =
        document.createDocumentFragment();

    var fragmentoFondos =
        document.createDocumentFragment();

    var indice;

    for (
        indice = 0;
        indice < imagenes.length;
        indice++
    ) {

        var archivo =
            imagenes[indice];

        var urlImagen =
            construirUrlImagen(
                archivo
            );


        /* IMAGEN PRINCIPAL */

        var slide =
            document.createElement(
                "img"
            );

        slide.className =
            "slide";

        slide.src =
            urlImagen;

        slide.alt =
            archivo.name;

        slide.setAttribute(
            "data-tiempo",
            String(
                tiempoPredeterminado
            )
        );

        slide.setAttribute(
            "data-nombre",
            archivo.name
        );

        slide.setAttribute(
            "data-sha",
            archivo.sha
        );

        if (indice === 0) {

            agregarClase(
                slide,
                "active"
            );

        }

        fragmentoSlides.appendChild(
            slide
        );


        /* FONDO */

        var fondo =
            document.createElement(
                "img"
            );

        fondo.className =
            "slide-bg";

        fondo.src =
            urlImagen;

        fondo.alt =
            "";

        fondo.setAttribute(
            "aria-hidden",
            "true"
        );

        if (indice === 0) {

            agregarClase(
                fondo,
                "active"
            );

        }

        fragmentoFondos.appendChild(
            fondo
        );

    }


    /*
        Compatible con navegadores antiguos.
        No utiliza replaceChildren().
    */

    contenedorPrincipal.innerHTML =
        "";

    contenedorFondos.innerHTML =
        "";

    contenedorPrincipal.appendChild(
        fragmentoSlides
    );

    contenedorFondos.appendChild(
        fragmentoFondos
    );


    /*
        Convertir las colecciones a arreglos
        mediante ciclos tradicionales.
    */

    slides =
        [];

    backgroundSlides =
        [];

    var nodosSlides =
        contenedorPrincipal
            .getElementsByTagName(
                "img"
            );

    var nodosFondos =
        contenedorFondos
            .getElementsByTagName(
                "img"
            );

    for (
        indice = 0;
        indice < nodosSlides.length;
        indice++
    ) {

        slides.push(
            nodosSlides[indice]
        );

    }

    for (
        indice = 0;
        indice < nodosFondos.length;
        indice++
    ) {

        backgroundSlides.push(
            nodosFondos[indice]
        );

    }

    currentIndex =
        0;

    firmaImagenesActual =
        nuevaFirma;

    imagenesPendientes =
        null;

    firmaPendiente =
        "";

    programarSiguienteCambio();

}



// ======================================================
// 24. CAMBIAR SLIDE
// ======================================================

function cambiarSlide() {

    if (
        !slides
        ||
        slides.length === 0
    ) {

        return;

    }


    /*
        Si solo hay una imagen.
    */

    if (
        slides.length === 1
    ) {

        if (
            imagenesPendientes !== null
        ) {

            aplicarNuevaLista(
                imagenesPendientes,
                firmaPendiente
            );

            return;

        }

        programarSiguienteCambio();

        return;

    }


    var siguienteIndice =

        (
            currentIndex + 1
        )

        %

        slides.length;


    var vueltaTerminada =
        siguienteIndice === 0;


    /*
        Aplicar cambios al completar la vuelta.
    */

    if (
        vueltaTerminada
        &&
        imagenesPendientes !== null
    ) {

        aplicarNuevaLista(
            imagenesPendientes,
            firmaPendiente
        );

        return;

    }


    quitarClase(
        slides[currentIndex],
        "active"
    );

    if (
        backgroundSlides[currentIndex]
    ) {

        quitarClase(
            backgroundSlides[currentIndex],
            "active"
        );

    }


    currentIndex =
        siguienteIndice;


    agregarClase(
        slides[currentIndex],
        "active"
    );

    if (
        backgroundSlides[currentIndex]
    ) {

        agregarClase(
            backgroundSlides[currentIndex],
            "active"
        );

    }


    programarSiguienteCambio();

}



// ======================================================
// 25. PROGRAMAR SLIDE
// ======================================================

function programarSiguienteCambio() {

    if (
        !slides
        ||
        slides.length === 0
    ) {

        return;

    }

    var valorTiempo =
        slides[currentIndex]
            .getAttribute(
                "data-tiempo"
            );

    var tiempoActual =
        parseInt(
            valorTiempo,
            10
        );

    if (
        isNaN(
            tiempoActual
        )
    ) {

        tiempoActual =
            tiempoPredeterminado;

    }

    if (timerSlide !== null) {

        clearTimeout(
            timerSlide
        );

    }

    timerSlide =
        setTimeout(
            function () {

                cambiarSlide();

            },
            tiempoActual
        );

}



// ======================================================
// 26. MENSAJE
// ======================================================

function mostrarMensaje(
    mensaje
) {

    var contenedor =
        document.getElementById(
            "slideshow"
        );

    if (!contenedor) {
        return;
    }

    contenedor.innerHTML =
        "";

    var elementoMensaje =
        document.createElement(
            "div"
        );

    elementoMensaje.className =
        "mensaje-estado";

    establecerTexto(
        elementoMensaje,
        mensaje
    );

    contenedor.appendChild(
        elementoMensaje
    );

}



// ======================================================
// 27. RELOJ Y FECHA
// ======================================================

function actualizarTiempo() {

    var ahora =
        new Date();

    var horas =
        ahora.getHours();

    var minutos =
        ahora.getMinutes();

    if (minutos < 10) {

        minutos =
            "0" + minutos;

    }

    var horaDoce =
        horas % 12;

    if (horaDoce === 0) {

        horaDoce =
            12;

    }

    var textoHora =
        horaDoce
        +
        ":"
        +
        minutos;

    establecerTexto(
        document.getElementById(
            "reloj"
        ),
        textoHora
    );


    var diasSemana = [
        "Domingo",
        "Lunes",
        "Martes",
        "Miércoles",
        "Jueves",
        "Viernes",
        "Sábado"
    ];

    var meses = [
        "enero",
        "febrero",
        "marzo",
        "abril",
        "mayo",
        "junio",
        "julio",
        "agosto",
        "septiembre",
        "octubre",
        "noviembre",
        "diciembre"
    ];

    var textoFecha =

        diasSemana[
            ahora.getDay()
        ]

        +

        " "

        +

        ahora.getDate()

        +

        " de "

        +

        meses[
            ahora.getMonth()
        ];


    establecerTexto(
        document.getElementById(
            "fecha"
        ),
        textoFecha
    );


    /*
        Modo eco antes de 7:00 a. m.
        y desde las 4:00 p. m.
    */

    if (
        horas < 7
        ||
        horas >= 16
    ) {

        agregarClase(
            document.body,
            "modo-eco"
        );

    }

    else {

        quitarClase(
            document.body,
            "modo-eco"
        );

    }

}



// ======================================================
// 28. PIXEL SHIFT
// ======================================================

function ejecutarPixelShift() {

    var barra =
        document.getElementById(
            "barra-institucional"
        );

    if (!barra) {
        return;
    }

    var desvioTop =
        Math.floor(
            Math.random() * 5
        )
        -
        2;

    var desvioLeft =
        Math.floor(
            Math.random() * 5
        )
        -
        2;

    barra.style.top =
        desvioTop
        +
        "px";

    barra.style.left =
        desvioLeft
        +
        "px";

}



// ======================================================
// 29. INICIAR
// ======================================================

function iniciarPantalla() {

    var indicador =
        document.getElementById(
            "indicador-estado"
        );

    agregarEvento(
        indicador,
        "click",
        alternarPanelDiagnostico
    );

    actualizarTiempo();

    consultarImagenesGitHub();

    setInterval(
        actualizarTiempo,
        15000
    );

    setInterval(
        ejecutarPixelShift,
        60000
    );

}



// ======================================================
// 30. INICIAR AL CARGAR
// ======================================================

if (
    document.readyState === "complete"
    ||
    document.readyState === "interactive"
) {

    iniciarPantalla();

}

else {

    agregarEvento(
        window,
        "load",
        iniciarPantalla
    );

}


/*
=========================================================

NO EXISTE location.reload()

La pantalla:

1. Consulta api.github.com mediante XMLHttpRequest.
2. Utiliza download_url para descargar cada imagen.
3. Precarga las imágenes secuencialmente.
4. Muestra únicamente las que cargaron correctamente.
5. Consulta cambios cada 5 minutos.
6. Reintenta a los 30 segundos si ocurre un error.
7. Conserva las imágenes existentes si falla una consulta.
8. Aplica cambios al finalizar la vuelta del slideshow.

Selecciona el punto inferior derecho para abrir
el diagnóstico.

=========================================================
*/


</script>
