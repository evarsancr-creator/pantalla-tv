<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pantalla Corporativa DABS</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body,
        html {

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background-color: #0d1117;
        }


        /* =====================================================
           CONTENEDOR GENERAL
        ===================================================== */

        .pantalla-completa {

            display: flex;
            flex-direction: column;

            width: 100vw;
            height: 100vh;

            padding: 20px;

            gap: 15px;

            position: relative;

            z-index: 5;
        }



        /* =====================================================
           MARCO SUPERIOR
        ===================================================== */

        .marco-superior {

            width: 100%;
            height: 15vh;

            background:
                rgba(13, 17, 23, 0.15);

            backdrop-filter:
                blur(5px);

            -webkit-backdrop-filter:
                blur(5px);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 16px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            padding:
                0 30px;

            box-shadow:
                0 8px 32px 0 rgba(0, 0, 0, 0.4);

            position: relative;

            top: 0;

            left: 0;

            transition:
                top 0.5s ease,
                left 0.5s ease,
                opacity 1s ease,
                filter 1s ease;
        }



        /* =====================================================
           LOGO
        ===================================================== */

        .contenedor-logo {

            height: 80%;

            display: flex;

            align-items: center;
        }


        .logo-ccss {

            height: 100%;

            object-fit: contain;

            filter:
                drop-shadow(
                    0px 0px 8px
                    rgba(255, 255, 255, 0.15)
                );
        }



        /* =====================================================
           TÍTULOS
        ===================================================== */

        .bloque-titulos {

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            flex-grow: 1;

            padding:
                0 20px;

            text-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.8);
        }


        .texto-institucion-gerencia {

            color: #60a5fa;

            font-size: 1.1vw;

            font-weight: 600;

            letter-spacing: 1px;

            text-transform:
                uppercase;

            margin-bottom: 2px;
        }


        .texto-direccion {

            color: #e2e8f0;

            font-size: 1.9vw;

            font-weight: 700;

            letter-spacing:
                0.5px;

            text-transform:
                uppercase;

            text-align: center;
        }



        /* =====================================================
           RELOJ
        ===================================================== */

        .tiempo-contenedor {

            display: flex;

            flex-direction: column;

            align-items:
                flex-end;

            justify-content:
                center;

            min-width: 220px;
        }


        .reloj {

            color: #cbd5e1;

            font-size: 2.4vw;

            font-weight: 700;

            font-family:
                'Segoe UI',
                sans-serif;

            text-shadow:
                0 0 8px rgba(224, 242, 254, 0.2),
                0 2px 4px rgba(0, 0, 0, 0.6);

            line-height: 1;

            margin-bottom: 4px;

            letter-spacing:
                -1px;
        }


        .fecha {

            color: #94a3b8;

            font-size: 1.1vw;

            font-weight: 500;

            letter-spacing:
                0.5px;

            text-shadow:
                0 1px 3px
                rgba(0, 0, 0, 0.6);
        }



        /* =====================================================
           SLIDESHOW
        ===================================================== */

        .slideshow-container {

            width: 100%;

            height: 79vh;

            position: relative;

            display: flex;

            justify-content:
                center;

            align-items:
                center;

            background-color:
                rgba(0, 0, 0, 0.2);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius:
                20px;

            overflow: hidden;

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, 0.6);
        }



        /* =====================================================
           IMÁGENES PRINCIPALES
        ===================================================== */

        img.slide {

            position: absolute;

            max-width: 100%;

            max-height: 100%;

            object-fit:
                contain;

            opacity: 0;

            z-index: 2;

            transform:
                scale(0.97);

            transition:
                opacity 1.2s ease-in-out,
                transform 1.2s ease-in-out;
        }


        img.slide.active {

            opacity: 1;

            transform:
                scale(1);
        }



        /* =====================================================
           FONDO AMBIENTE
        ===================================================== */

        .background-ambientes {

            position: absolute;

            top: 0;

            left: 0;

            width: 100vw;

            height: 100vh;

            z-index: 1;

            overflow: hidden;

            transition:
                filter 1s ease;
        }


        img.slide-bg {

            position: absolute;

            width: 100%;

            height: 100%;

            object-fit: cover;

            opacity: 0;

            filter:
                blur(60px)
                brightness(0.4)
                saturate(1.4);

            transition:
                opacity 1.2s ease-in-out;
        }


        img.slide-bg.active {

            opacity: 1;
        }



        /* =====================================================
           MODO PROTECCIÓN
        ===================================================== */

        .modo-eco .marco-superior {

            opacity: 0.3;

            background:
                rgba(13, 17, 23, 0.3);

            filter:
                grayscale(0.5);
        }


        .modo-eco .background-ambientes {

            filter:
                brightness(0.1);
        }


        /* =====================================================
           MENSAJE EN CASO DE ERROR
        ===================================================== */

        .mensaje-error {

            color: #e2e8f0;

            font-size: 1.3vw;

            text-align: center;

            padding: 30px;

            z-index: 10;
        }

    </style>

</head>



<body>


    <!-- =====================================================
         FONDO DINÁMICO
    ====================================================== -->

    <div
        class="background-ambientes"
        id="bg-ambientes">
    </div>



    <!-- =====================================================
         CONTENIDO GENERAL
    ====================================================== -->

    <div
        class="pantalla-completa"
        id="contenedor-principal">


        <!-- =================================================
             ENCABEZADO
        ================================================== -->

        <header
            class="marco-superior"
            id="barra-institucional">


            <div class="contenedor-logo">

                <img
                    class="logo-ccss"
                    src="logo-ccss.png"
                    alt="Logo CCSS">

            </div>



            <div class="bloque-titulos">

                <h2 class="texto-institucion-gerencia">

                    Caja Costarricense de Seguro Social -
                    Gerencia de Logística

                </h2>


                <h1 class="texto-direccion">

                    Dirección de Aprovisionamiento
                    de Bienes y Servicios

                </h1>

            </div>



            <div class="tiempo-contenedor">

                <div
                    class="reloj"
                    id="reloj">

                    00:00

                </div>


                <div
                    class="fecha"
                    id="fecha">

                    Cargando...

                </div>

            </div>


        </header>



        <!-- =================================================
             SLIDESHOW
             
             IMPORTANTE:
             JavaScript insertará automáticamente aquí
             todas las imágenes encontradas en /imagenes
        ================================================== -->

        <main
            class="slideshow-container"
            id="slideshow">
        </main>


    </div>




<script>


// ======================================================
// CONFIGURACIÓN GENERAL
// ======================================================

const usuarioGitHub =
    "evarsancr-creator";

const repositorioGitHub =
    "pantalla-tv";

const carpetaImagenes =
    "imagenes";


const tiempoPredeterminado =
    8000;



// ======================================================
// VARIABLES DEL SLIDESHOW
// ======================================================

let currentIndex = 0;

let slides = [];

let backgroundSlides = [];

let timerID = null;



// ======================================================
// CARGAR IMÁGENES DE GITHUB
// ======================================================

async function cargarImagenes() {


    try {


        // -----------------------------------------------
        // CONSTRUIR URL DE LA API
        // -----------------------------------------------

        const apiURL =
            `https://api.github.com/repos/${usuarioGitHub}/${repositorioGitHub}/contents/${carpetaImagenes}`;


        console.log(
            "Consultando imágenes:",
            apiURL
        );



        // -----------------------------------------------
        // CONSULTAR GITHUB
        // -----------------------------------------------

        const respuesta =
            await fetch(
                apiURL,
                {
                    cache: "no-store"
                }
            );



        if (!respuesta.ok) {

            throw new Error(
                `GitHub respondió con estado ${respuesta.status}`
            );

        }



        const archivos =
            await respuesta.json();



        // -----------------------------------------------
        // FILTRAR SOLAMENTE IMÁGENES
        // -----------------------------------------------

        const imagenes =
            archivos.filter(
                archivo =>

                    archivo.type === "file"

                    &&

                    /\.(png|jpg|jpeg|webp|gif)$/i
                        .test(archivo.name)
            );



        console.log(
            "Imágenes encontradas:",
            imagenes.length
        );



        // -----------------------------------------------
        // VERIFICAR QUE EXISTAN IMÁGENES
        // -----------------------------------------------

        if (imagenes.length === 0) {

            mostrarError(
                "No se encontraron imágenes en la carpeta."
            );

            return;

        }



        // -----------------------------------------------
        // LOCALIZAR CONTENEDORES
        // -----------------------------------------------

        const contenedorPrincipal =
            document.getElementById(
                "slideshow"
            );


        const contenedorFondos =
            document.getElementById(
                "bg-ambientes"
            );



        if (!contenedorPrincipal) {

            throw new Error(
                'No se encontró el contenedor "slideshow".'
            );

        }



        if (!contenedorFondos) {

            throw new Error(
                'No se encontró el contenedor "bg-ambientes".'
            );

        }



        // -----------------------------------------------
        // DETENER TEMPORIZADOR ANTERIOR
        // -----------------------------------------------

        clearTimeout(
            timerID
        );



        // -----------------------------------------------
        // LIMPIAR CONTENEDORES
        // -----------------------------------------------

        contenedorPrincipal.innerHTML =
            "";

        contenedorFondos.innerHTML =
            "";



        // -----------------------------------------------
        // CREAR CADA IMAGEN
        // -----------------------------------------------

        imagenes.forEach(
            (archivo, index) => {


                // =======================================
                // IMAGEN PRINCIPAL
                // =======================================

                const slide =
                    document.createElement(
                        "img"
                    );


                slide.className =
                    "slide";


                slide.src =
                    archivo.download_url;


                slide.alt =
                    archivo.name;


                slide.dataset.tiempo =
                    tiempoPredeterminado;



                if (index === 0) {

                    slide.classList.add(
                        "active"
                    );

                }



                contenedorPrincipal
                    .appendChild(
                        slide
                    );




                // =======================================
                // IMAGEN DE FONDO
                // =======================================

                const fondo =
                    document.createElement(
                        "img"
                    );


                fondo.className =
                    "slide-bg";


                fondo.src =
                    archivo.download_url;


                fondo.alt =
                    "";



                if (index === 0) {

                    fondo.classList.add(
                        "active"
                    );

                }



                contenedorFondos
                    .appendChild(
                        fondo
                    );


            }
        );



        // -----------------------------------------------
        // ACTUALIZAR LISTAS DE SLIDES
        // -----------------------------------------------

        slides =
            document.querySelectorAll(
                "#slideshow .slide"
            );


        backgroundSlides =
            document.querySelectorAll(
                "#bg-ambientes .slide-bg"
            );



        console.log(
            "Slides creados:",
            slides.length
        );



        // -----------------------------------------------
        // COMENZAR DESDE PRIMERA IMAGEN
        // -----------------------------------------------

        currentIndex =
            0;



        // -----------------------------------------------
        // INICIAR SLIDESHOW
        // -----------------------------------------------

        programarSiguienteCambio();


    }


    catch (error) {


        console.error(
            "ERROR CARGANDO IMÁGENES:",
            error
        );


        mostrarError(
            "No fue posible cargar las imágenes."
        );


    }


}



// ======================================================
// MOSTRAR ERROR EN PANTALLA
// ======================================================

function mostrarError(mensaje) {


    const contenedor =
        document.getElementById(
            "slideshow"
        );


    if (!contenedor) {
        return;
    }


    contenedor.innerHTML =
        "";


    const texto =
        document.createElement(
            "div"
        );


    texto.className =
        "mensaje-error";


    texto.textContent =
        mensaje;


    contenedor.appendChild(
        texto
    );


}



// ======================================================
// CAMBIAR IMAGEN
// ======================================================

function changeSlide() {


    if (slides.length === 0) {

        return;

    }



    // -----------------------------------------------
    // SI SOLO EXISTE UNA IMAGEN
    // -----------------------------------------------

    if (slides.length === 1) {

        programarSiguienteCambio();

        return;

    }



    // -----------------------------------------------
    // QUITAR IMAGEN ACTUAL
    // -----------------------------------------------

    slides[currentIndex]
        .classList.remove(
            "active"
        );


    backgroundSlides[currentIndex]
        .classList.remove(
            "active"
        );



    // -----------------------------------------------
    // SIGUIENTE POSICIÓN
    // -----------------------------------------------

    currentIndex =
        (currentIndex + 1)
        % slides.length;



    // -----------------------------------------------
    // MOSTRAR NUEVA IMAGEN
    // -----------------------------------------------

    slides[currentIndex]
        .classList.add(
            "active"
        );


    backgroundSlides[currentIndex]
        .classList.add(
            "active"
        );



    // -----------------------------------------------
    // PROGRAMAR SIGUIENTE
    // -----------------------------------------------

    programarSiguienteCambio();


}



// ======================================================
// PROGRAMAR SIGUIENTE CAMBIO
// ======================================================

function programarSiguienteCambio() {


    if (slides.length === 0) {

        return;

    }



    const tiempoActual =

        parseInt(
            slides[currentIndex]
                .dataset
                .tiempo,
            10
        )

        ||

        tiempoPredeterminado;



    clearTimeout(
        timerID
    );



    timerID =
        setTimeout(

            changeSlide,

            tiempoActual

        );


}



// ======================================================
// RELOJ + FECHA + MODO ECO
// ======================================================

function actualizarTiempo() {


    const ahora =
        new Date();



    // -----------------------------------------------
    // HORA
    // -----------------------------------------------

    const opcionesReloj = {

        hour:
            "numeric",

        minute:
            "2-digit",

        hour12:
            true

    };



    let hora12 =
        ahora.toLocaleTimeString(
            "es-CR",
            opcionesReloj
        );



    hora12 =
        hora12
            .replace(/\./g, "")
            .replace(/[a-zA-Z]/g, "")
            .trim();



    document
        .getElementById(
            "reloj"
        )
        .textContent =
        hora12;



    // -----------------------------------------------
    // FECHA
    // -----------------------------------------------

    const opcionesFecha = {

        weekday:
            "long",

        day:
            "numeric",

        month:
            "long"

    };



    let fechaTexto =
        ahora.toLocaleDateString(
            "es-ES",
            opcionesFecha
        );



    fechaTexto =

        fechaTexto
            .charAt(0)
            .toUpperCase()

        +

        fechaTexto
            .slice(1);



    document
        .getElementById(
            "fecha"
        )
        .textContent =
        fechaTexto;



    // -----------------------------------------------
    // MODO ECO
    //
    // Antes de 7:00 AM
    // Desde 4:00 PM
    // -----------------------------------------------

    const horaActual =
        ahora.getHours();


    const cuerpo =
        document.body;



    if (

        horaActual < 7

        ||

        horaActual >= 16

    ) {


        cuerpo.classList.add(
            "modo-eco"
        );


    }

    else {


        cuerpo.classList.remove(
            "modo-eco"
        );


    }


}



// ======================================================
// PIXEL SHIFT ANTI QUEMADO
// ======================================================

function ejecutarPixelShift() {


    const barra =
        document.getElementById(
            "barra-institucional"
        );



    if (!barra) {

        return;

    }



    const desvioTop =

        Math.floor(
            Math.random() * 5
        )

        - 2;



    const desvioLeft =

        Math.floor(
            Math.random() * 5
        )

        - 2;



    barra.style.top =
        desvioTop + "px";


    barra.style.left =
        desvioLeft + "px";


}



// ======================================================
// INICIAR PANTALLA
// ======================================================


// Cargar automáticamente imágenes
cargarImagenes();


// Cargar inmediatamente reloj y fecha
actualizarTiempo();


// Actualizar reloj
setInterval(
    actualizarTiempo,
    15000
);


// Pixel shift cada minuto
setInterval(
    ejecutarPixelShift,
    60000
);


// ======================================================
// REFRESCO COMPLETO CADA 24 HORAS
// ======================================================

setTimeout(

    function () {

        location.reload();

    },

    86400000

);


</script>


</body>

</html>
