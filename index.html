<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pantalla Corporativa DABS</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background-color: #0d1117;
        }


        /* =====================================================
           CONTENEDOR GENERAL
        ===================================================== */

        .pantalla-completa {
            display: flex;
            flex-direction: column;

            width: 100vw;
            height: 100vh;

            padding: 20px;
            gap: 15px;

            position: relative;
            z-index: 5;
        }


        /* =====================================================
           MARCO SUPERIOR
        ===================================================== */

        .marco-superior {
            width: 100%;
            height: 15vh;

            background:
                rgba(13, 17, 23, 0.15);

            backdrop-filter:
                blur(5px);

            -webkit-backdrop-filter:
                blur(5px);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4);

            position: relative;
            top: 0;
            left: 0;

            transition:
                top 0.5s ease,
                left 0.5s ease,
                opacity 1s ease,
                filter 1s ease;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .contenedor-logo {
            height: 80%;

            display: flex;
            align-items: center;
        }

        .logo-ccss {
            height: 100%;
            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(255, 255, 255, 0.15)
                );
        }


        /* =====================================================
           TÍTULOS
        ===================================================== */

        .bloque-titulos {
            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            flex-grow: 1;

            padding: 0 20px;

            text-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.8);
        }

        .texto-institucion-gerencia {
            color: #60a5fa;

            font-size: 1.1vw;
            font-weight: 600;

            letter-spacing: 1px;
            text-transform: uppercase;

            margin-bottom: 2px;
        }

        .texto-direccion {
            color: #e2e8f0;

            font-size: 1.9vw;
            font-weight: 700;

            letter-spacing: 0.5px;

            text-transform: uppercase;
            text-align: center;
        }


        /* =====================================================
           RELOJ
        ===================================================== */

        .tiempo-contenedor {
            display: flex;
            flex-direction: column;

            align-items: flex-end;
            justify-content: center;

            min-width: 220px;
        }

        .reloj {
            color: #cbd5e1;

            font-size: 2.4vw;
            font-weight: 700;

            font-family:
                "Segoe UI",
                sans-serif;

            text-shadow:
                0 0 8px rgba(224, 242, 254, 0.2),
                0 2px 4px rgba(0, 0, 0, 0.6);

            line-height: 1;
            margin-bottom: 4px;

            letter-spacing: -1px;
        }

        .fecha {
            color: #94a3b8;

            font-size: 1.1vw;
            font-weight: 500;

            letter-spacing: 0.5px;

            text-shadow:
                0 1px 3px
                rgba(0, 0, 0, 0.6);
        }


        /* =====================================================
           SLIDESHOW
        ===================================================== */

        .slideshow-container {
            width: 100%;
            height: 79vh;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color:
                rgba(0, 0, 0, 0.2);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, 0.6);
        }


        /* =====================================================
           IMÁGENES PRINCIPALES
        ===================================================== */

        img.slide {
            position: absolute;

            max-width: 100%;
            max-height: 100%;

            object-fit: contain;

            opacity: 0;
            z-index: 2;

            transform:
                scale(0.97);

            transition:
                opacity 1.2s ease-in-out,
                transform 1.2s ease-in-out;
        }

        img.slide.active {
            opacity: 1;

            transform:
                scale(1);
        }


        /* =====================================================
           FONDO DIFUMINADO
        ===================================================== */

        .background-ambientes {
            position: absolute;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            z-index: 1;

            overflow: hidden;

            transition:
                filter 1s ease;
        }

        img.slide-bg {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: cover;

            opacity: 0;

            filter:
                blur(60px)
                brightness(0.4)
                saturate(1.4);

            transition:
                opacity 1.2s ease-in-out;
        }

        img.slide-bg.active {
            opacity: 1;
        }


        /* =====================================================
           MODO PROTECCIÓN
        ===================================================== */

        .modo-eco .marco-superior {
            opacity: 0.3;

            background:
                rgba(13, 17, 23, 0.3);

            filter:
                grayscale(0.5);
        }

        .modo-eco .background-ambientes {
            filter:
                brightness(0.1);
        }


        /* =====================================================
           MENSAJE DE ESTADO
        ===================================================== */

        .mensaje-estado {
            color: #e2e8f0;

            font-size: 1.2vw;
            font-weight: 500;

            text-align: center;

            padding: 30px;

            z-index: 10;
        }

    </style>

</head>


<body>


    <!-- Fondo difuminado -->

    <div
        class="background-ambientes"
        id="bg-ambientes">
    </div>


    <!-- Pantalla principal -->

    <div
        class="pantalla-completa"
        id="contenedor-principal">


        <header
            class="marco-superior"
            id="barra-institucional">


            <div class="contenedor-logo">

                <img
                    class="logo-ccss"
                    src="logo-ccss.png"
                    alt="Logo CCSS"
                >

            </div>


            <div class="bloque-titulos">

                <h2 class="texto-institucion-gerencia">
                    Caja Costarricense de Seguro Social -
                    Gerencia de Logística
                </h2>

                <h1 class="texto-direccion">
                    Dirección de Aprovisionamiento
                    de Bienes y Servicios
                </h1>

            </div>


            <div class="tiempo-contenedor">

                <div
                    class="reloj"
                    id="reloj">
                    00:00
                </div>

                <div
                    class="fecha"
                    id="fecha">
                    Cargando...
                </div>

            </div>


        </header>


        <!--
            Las imágenes se insertan automáticamente
            desde la carpeta /imagenes de GitHub.
        -->

        <main
            class="slideshow-container"
            id="slideshow">
        </main>


    </div>


<script>


// ======================================================
// 1. CONFIGURACIÓN
// ======================================================

const usuarioGitHub =
    "evarsancr-creator";

const repositorioGitHub =
    "pantalla-tv";

const carpetaImagenes =
    "imagenes";


// Duración de cada imagen: 8 segundos

const tiempoPredeterminado =
    8000;


// Consulta GitHub cada 5 minutos.

const intervaloConsultaGitHub =
    5 * 60 * 1000;



// ======================================================
// 2. VARIABLES DEL SLIDESHOW
// ======================================================

let currentIndex =
    0;

let slides =
    [];

let backgroundSlides =
    [];

let timerID =
    null;


// Firma actualmente mostrada.

let firmaImagenesActual =
    "";


// Datos detectados en GitHub que todavía
// no se han aplicado al slideshow.

let imagenesPendientes =
    null;

let firmaPendiente =
    "";


// Impide ejecutar dos consultas simultáneas.

let consultaEnProceso =
    false;


// Indica si es la carga inicial.

let cargaInicialCompletada =
    false;



// ======================================================
// 3. CONSULTAR IMÁGENES EN GITHUB
// ======================================================

async function consultarImagenesGitHub() {


    if (consultaEnProceso) {

        console.log(
            "Ya existe una consulta a GitHub en proceso."
        );

        return;

    }


    consultaEnProceso =
        true;


    try {


        const apiURL =
            `https://api.github.com/repos/${usuarioGitHub}/${repositorioGitHub}/contents/${carpetaImagenes}`;


        console.log(
            "Consultando carpeta de imágenes..."
        );


        const respuesta =
            await fetch(
                apiURL,
                {
                    method: "GET",
                    cache: "no-store",

                    headers: {
                        "Accept":
                            "application/vnd.github+json"
                    }
                }
            );


        if (!respuesta.ok) {

            throw new Error(
                `GitHub respondió con estado ${respuesta.status}`
            );

        }


        const archivos =
            await respuesta.json();


        if (!Array.isArray(archivos)) {

            throw new Error(
                "La respuesta recibida no contiene una lista de archivos."
            );

        }


        // Filtrar únicamente formatos de imagen.

        const imagenes =
            archivos
                .filter(
                    archivo =>

                        archivo.type === "file"

                        &&

                        /\.(png|jpg|jpeg|webp|gif)$/i
                            .test(archivo.name)
                )
                .sort(
                    (archivoA, archivoB) =>

                        archivoA.name.localeCompare(
                            archivoB.name,
                            "es",
                            {
                                numeric: true,
                                sensitivity: "base"
                            }
                        )
                );


        console.log(
            "Cantidad de imágenes encontradas:",
            imagenes.length
        );


        // La firma usa nombre y SHA.
        // Por eso detecta:
        // - imagen nueva;
        // - imagen eliminada;
        // - imagen reemplazada con el mismo nombre.

        const nuevaFirma =
            imagenes
                .map(
                    archivo =>
                        `${archivo.name}:${archivo.sha}`
                )
                .join("|");


        // ----------------------------------------------
        // PRIMERA CARGA
        // ----------------------------------------------

        if (!cargaInicialCompletada) {

            if (imagenes.length === 0) {

                mostrarMensaje(
                    "No se encontraron imágenes en la carpeta."
                );

                return;

            }


            aplicarNuevaLista(
                imagenes,
                nuevaFirma
            );


            cargaInicialCompletada =
                true;


            console.log(
                "Carga inicial completada."
            );


            return;

        }


        // ----------------------------------------------
        // NO HAY CAMBIOS
        // ----------------------------------------------

        if (nuevaFirma === firmaImagenesActual) {

            // Si había una actualización pendiente,
            // pero la carpeta volvió al estado actual,
            // se cancela esa actualización.

            imagenesPendientes =
                null;

            firmaPendiente =
                "";


            console.log(
                "No existen cambios en las imágenes."
            );


            return;

        }


        // ----------------------------------------------
        // CAMBIO DETECTADO
        // ----------------------------------------------

        imagenesPendientes =
            imagenes;

        firmaPendiente =
            nuevaFirma;


        console.log(
            "Se detectaron cambios. Se aplicarán al terminar la vuelta actual."
        );


        // Caso especial:
        // si ya no queda ninguna imagen en GitHub.

        if (imagenes.length === 0) {

            console.warn(
                "La carpeta de imágenes quedó vacía."
            );

        }


        // Si solo hay una imagen actualmente,
        // no existe una vuelta que terminar.
        // La actualización se aplica al vencer su tiempo.

    }


    catch (error) {


        console.error(
            "No fue posible consultar las imágenes:",
            error
        );


        // Importante:
        // si el slideshow ya funciona, no lo borramos.
        // Conservamos las imágenes existentes.

        if (!cargaInicialCompletada) {

            mostrarMensaje(
                "No fue posible cargar las imágenes."
            );

        }


    }


    finally {

        consultaEnProceso =
            false;

    }


}



// ======================================================
// 4. APLICAR NUEVA LISTA DE IMÁGENES
// ======================================================

function aplicarNuevaLista(
    imagenes,
    nuevaFirma
) {


    clearTimeout(
        timerID
    );


    const contenedorPrincipal =
        document.getElementById(
            "slideshow"
        );


    const contenedorFondos =
        document.getElementById(
            "bg-ambientes"
        );


    if (
        !contenedorPrincipal
        ||
        !contenedorFondos
    ) {

        console.error(
            "No se encontraron los contenedores del slideshow."
        );

        return;

    }


    contenedorPrincipal.innerHTML =
        "";

    contenedorFondos.innerHTML =
        "";


    // Si se eliminaron todas las imágenes,
    // mostramos un mensaje y dejamos de programar cambios.

    if (imagenes.length === 0) {

        slides =
            [];

        backgroundSlides =
            [];

        currentIndex =
            0;

        firmaImagenesActual =
            nuevaFirma;

        imagenesPendientes =
            null;

        firmaPendiente =
            "";

        mostrarMensaje(
            "No hay imágenes disponibles."
        );

        console.warn(
            "El slideshow quedó sin imágenes."
        );

        return;

    }


    imagenes.forEach(
        (archivo, index) => {


            /*
                Agregamos el SHA como versión.

                Si Insumos.png se reemplaza manteniendo
                el mismo nombre, la URL cambia de:

                Insumos.png?v=SHA-ANTERIOR

                a:

                Insumos.png?v=SHA-NUEVO

                Así evitamos mostrar la versión almacenada
                anteriormente en la caché del navegador.
            */

            const urlVersionada =
                `${archivo.download_url}?v=${archivo.sha}`;


            // ==========================================
            // IMAGEN PRINCIPAL
            // ==========================================

            const slide =
                document.createElement(
                    "img"
                );


            slide.className =
                "slide";


            slide.src =
                urlVersionada;


            slide.alt =
                archivo.name;


            slide.dataset.tiempo =
                String(
                    tiempoPredeterminado
                );


            slide.dataset.nombre =
                archivo.name;


            slide.dataset.sha =
                archivo.sha;


            if (index === 0) {

                slide.classList.add(
                    "active"
                );

            }


            contenedorPrincipal.appendChild(
                slide
            );



            // ==========================================
            // FONDO DIFUMINADO
            // ==========================================

            const fondo =
                document.createElement(
                    "img"
                );


            fondo.className =
                "slide-bg";


            fondo.src =
                urlVersionada;


            fondo.alt =
                "";


            fondo.setAttribute(
                "aria-hidden",
                "true"
            );


            if (index === 0) {

                fondo.classList.add(
                    "active"
                );

            }


            contenedorFondos.appendChild(
                fondo
            );


        }
    );


    slides =
        document.querySelectorAll(
            "#slideshow .slide"
        );


    backgroundSlides =
        document.querySelectorAll(
            "#bg-ambientes .slide-bg"
        );


    currentIndex =
        0;


    firmaImagenesActual =
        nuevaFirma;


    imagenesPendientes =
        null;


    firmaPendiente =
        "";


    console.log(
        "Slideshow actualizado. Imágenes activas:",
        slides.length
    );


    programarSiguienteCambio();


}



// ======================================================
// 5. CAMBIAR DE IMAGEN
// ======================================================

function changeSlide() {


    if (slides.length === 0) {

        return;

    }


    // Si actualmente existe una sola imagen,
    // después de sus 8 segundos se pueden aplicar
    // cambios pendientes.

    if (slides.length === 1) {


        if (imagenesPendientes !== null) {

            console.log(
                "Aplicando actualización pendiente."
            );


            aplicarNuevaLista(
                imagenesPendientes,
                firmaPendiente
            );


            return;

        }


        programarSiguienteCambio();

        return;

    }


    const siguienteIndice =
        (currentIndex + 1)
        % slides.length;


    /*
        siguienteIndice === 0 significa que terminó
        una vuelta completa y regresaría a la primera
        imagen.

        Solo en ese momento se aplican los cambios
        pendientes.
    */

    const vueltaCompletada =
        siguienteIndice === 0;


    if (
        vueltaCompletada
        &&
        imagenesPendientes !== null
    ) {


        console.log(
            "Vuelta terminada. Aplicando cambios detectados."
        );


        aplicarNuevaLista(
            imagenesPendientes,
            firmaPendiente
        );


        return;

    }


    slides[currentIndex]
        .classList.remove(
            "active"
        );


    if (
        backgroundSlides[currentIndex]
    ) {

        backgroundSlides[currentIndex]
            .classList.remove(
                "active"
            );

    }


    currentIndex =
        siguienteIndice;


    slides[currentIndex]
        .classList.add(
            "active"
        );


    if (
        backgroundSlides[currentIndex]
    ) {

        backgroundSlides[currentIndex]
            .classList.add(
                "active"
            );

    }


    programarSiguienteCambio();


}



// ======================================================
// 6. PROGRAMAR SIGUIENTE CAMBIO
// ======================================================

function programarSiguienteCambio() {


    if (slides.length === 0) {

        clearTimeout(
            timerID
        );

        return;

    }


    const tiempoActual =

        parseInt(
            slides[currentIndex]
                .dataset
                .tiempo,
            10
        )

        ||

        tiempoPredeterminado;


    clearTimeout(
        timerID
    );


    timerID =
        setTimeout(
            changeSlide,
            tiempoActual
        );


}



// ======================================================
// 7. MOSTRAR MENSAJES
// ======================================================

function mostrarMensaje(mensaje) {


    const contenedor =
        document.getElementById(
            "slideshow"
        );


    if (!contenedor) {

        return;

    }


    contenedor.innerHTML =
        "";


    const elementoMensaje =
        document.createElement(
            "div"
        );


    elementoMensaje.className =
        "mensaje-estado";


    elementoMensaje.textContent =
        mensaje;


    contenedor.appendChild(
        elementoMensaje
    );


}



// ======================================================
// 8. RELOJ, FECHA Y MODO ECO
// ======================================================

function actualizarTiempo() {


    const ahora =
        new Date();


    // Hora

    const opcionesReloj = {

        hour:
            "numeric",

        minute:
            "2-digit",

        hour12:
            true

    };


    let hora12 =
        ahora.toLocaleTimeString(
            "es-CR",
            opcionesReloj
        );


    hora12 =
        hora12
            .replace(/\./g, "")
            .replace(/[a-zA-Z]/g, "")
            .trim();


    const elementoReloj =
        document.getElementById(
            "reloj"
        );


    if (elementoReloj) {

        elementoReloj.textContent =
            hora12;

    }


    // Fecha

    const opcionesFecha = {

        weekday:
            "long",

        day:
            "numeric",

        month:
            "long"

    };


    let fechaTexto =
        ahora.toLocaleDateString(
            "es-ES",
            opcionesFecha
        );


    fechaTexto =

        fechaTexto
            .charAt(0)
            .toUpperCase()

        +

        fechaTexto
            .slice(1);


    const elementoFecha =
        document.getElementById(
            "fecha"
        );


    if (elementoFecha) {

        elementoFecha.textContent =
            fechaTexto;

    }


    // Modo eco antes de 7:00 a. m.
    // y desde las 4:00 p. m.

    const horaActual =
        ahora.getHours();


    if (
        horaActual < 7
        ||
        horaActual >= 16
    ) {

        document.body.classList.add(
            "modo-eco"
        );

    }

    else {

        document.body.classList.remove(
            "modo-eco"
        );

    }


}



// ======================================================
// 9. PIXEL SHIFT ANTIQUEMADO
// ======================================================

function ejecutarPixelShift() {


    const barra =
        document.getElementById(
            "barra-institucional"
        );


    if (!barra) {

        return;

    }


    const desvioTop =

        Math.floor(
            Math.random() * 5
        )

        - 2;


    const desvioLeft =

        Math.floor(
            Math.random() * 5
        )

        - 2;


    barra.style.top =
        desvioTop + "px";


    barra.style.left =
        desvioLeft + "px";


}



// ======================================================
// 10. INICIAR PANTALLA
// ======================================================


// Primera carga de imágenes.

consultarImagenesGitHub();


// Consulta la carpeta cada 5 minutos.
// Esto NO refresca la página.

setInterval(
    consultarImagenesGitHub,
    intervaloConsultaGitHub
);


// Reloj y fecha.

actualizarTiempo();

setInterval(
    actualizarTiempo,
    15000
);


// Movimiento mínimo del encabezado.

setInterval(
    ejecutarPixelShift,
    60000
);


/*
    IMPORTANTE:

    No existe location.reload() en este código.

    La página permanece abierta.
    El refresco completo seguirá siendo manual
    por el tema del certificado.
*/


</script>

</body>

</html>
