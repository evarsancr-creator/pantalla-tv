<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pantalla Corporativa DABS</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                Arial,
                "Segoe UI",
                Tahoma,
                sans-serif;

            background-color: #0d1117;
        }


        /* =====================================================
           PANTALLA GENERAL
        ===================================================== */

        .pantalla-completa {
            position: relative;

            z-index: 5;

            display: flex;
            flex-direction: column;

            width: 100%;
            height: 100%;

            padding: 20px;

            gap: 15px;
        }


        /* =====================================================
           ENCABEZADO
        ===================================================== */

        .marco-superior {
            position: relative;

            top: 0;
            left: 0;

            width: 100%;
            height: 15%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            background:
                rgba(13, 17, 23, 0.65);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 16px;

            box-shadow:
                0 8px 32px
                rgba(0, 0, 0, 0.4);

            /*
                Si el navegador soporta backdrop-filter,
                aplicará el desenfoque.

                Si no lo soporta, simplemente conservará
                el fondo oscuro.
            */

            -webkit-backdrop-filter:
                blur(5px);

            backdrop-filter:
                blur(5px);

            transition:
                top 0.5s ease,
                left 0.5s ease,
                opacity 1s ease;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .contenedor-logo {
            height: 80%;

            display: flex;
            align-items: center;
        }


        .logo-ccss {
            height: 100%;
            max-width: 230px;

            object-fit: contain;
        }


        /* =====================================================
           TÍTULOS
        ===================================================== */

        .bloque-titulos {
            flex-grow: 1;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 0 20px;

            text-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.8);
        }


        .texto-institucion-gerencia {
            color: #60a5fa;

            font-size: 1.1vw;
            font-weight: 600;

            letter-spacing: 1px;

            text-transform: uppercase;

            text-align: center;

            margin-bottom: 2px;
        }


        .texto-direccion {
            color: #e2e8f0;

            font-size: 1.9vw;
            font-weight: 700;

            letter-spacing: 0.5px;

            text-transform: uppercase;

            text-align: center;
        }


        /* =====================================================
           RELOJ
        ===================================================== */

        .tiempo-contenedor {
            display: flex;
            flex-direction: column;

            align-items: flex-end;
            justify-content: center;

            min-width: 220px;
        }


        .reloj {
            color: #cbd5e1;

            font-size: 2.4vw;
            font-weight: 700;

            line-height: 1;

            margin-bottom: 4px;

            text-shadow:
                0 0 8px
                rgba(224, 242, 254, 0.2),
                0 2px 4px
                rgba(0, 0, 0, 0.6);
        }


        .fecha {
            color: #94a3b8;

            font-size: 1.1vw;
            font-weight: 500;

            letter-spacing: 0.5px;

            text-shadow:
                0 1px 3px
                rgba(0, 0, 0, 0.6);
        }


        /* =====================================================
           CONTENEDOR DE IMÁGENES
        ===================================================== */

        .slideshow-container {
            position: relative;

            width: 100%;
            height: calc(85% - 15px);

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            background-color:
                rgba(0, 0, 0, 0.30);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, 0.6);
        }


        /* =====================================================
           IMAGEN PRINCIPAL

           width y height al 100% permiten que las imágenes
           pequeñas ocupen el espacio disponible.

           object-fit: contain mantiene la proporción.
        ===================================================== */

        .slide {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;
            object-position: center center;

            opacity: 0;

            visibility: hidden;

            z-index: 2;

            transition:
                opacity 1.2s ease-in-out;

            /*
                Compatibilidad alternativa para navegadores
                que no aplican correctamente object-fit.
            */

            max-width: none;
            max-height: none;
        }


        .slide.active {
            opacity: 1;

            visibility: visible;
        }


        /* =====================================================
           FONDO DIFUMINADO
        ===================================================== */

        .background-ambientes {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            z-index: 1;

            overflow: hidden;

            background-color: #0d1117;
        }


        .slide-bg {
            position: absolute;

            top: -5%;
            left: -5%;

            width: 110%;
            height: 110%;

            object-fit: cover;

            opacity: 0;

            visibility: hidden;

            filter:
                blur(60px)
                brightness(0.4)
                saturate(1.4);

            -webkit-filter:
                blur(60px)
                brightness(0.4)
                saturate(1.4);

            transition:
                opacity 1.2s ease-in-out;
        }


        .slide-bg.active {
            opacity: 1;

            visibility: visible;
        }


        /* =====================================================
           MENSAJE DE ESTADO
        ===================================================== */

        .mensaje-estado {
            position: relative;

            z-index: 10;

            color: #cbd5e1;

            font-size: 22px;
            font-weight: 500;

            text-align: center;

            padding: 30px;
        }


        /* =====================================================
           INDICADOR DE ESTADO
        ===================================================== */

        .indicador-estado {
            position: fixed;

            right: 8px;
            bottom: 8px;

            width: 11px;
            height: 11px;

            border-radius: 50%;

            background-color: #64748b;

            z-index: 100;

            opacity: 0.75;
        }


        .estado-ok {
            background-color: #22c55e;
        }


        .estado-consultando {
            background-color: #f59e0b;
        }


        .estado-error {
            background-color: #ef4444;
        }


        /* =====================================================
           PANEL DE DIAGNÓSTICO
        ===================================================== */

        .panel-diagnostico {
            position: fixed;

            right: 15px;
            bottom: 28px;

            width: 340px;

            display: none;

            z-index: 200;

            padding: 15px;

            color: #e2e8f0;

            background-color:
                rgba(13, 17, 23, 0.96);

            border:
                1px solid rgba(255, 255, 255, 0.20);

            border-radius: 10px;

            font-size: 13px;
            line-height: 1.5;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.60);
        }


        .panel-diagnostico.visible {
            display: block;
        }


        .diagnostico-titulo {
            margin-bottom: 8px;

            color: #60a5fa;

            font-weight: 700;
        }


        /* =====================================================
           MODO ECO
        ===================================================== */

        .modo-eco .marco-superior {
            opacity: 0.35;

            background:
                rgba(13, 17, 23, 0.80);
        }


        .modo-eco .background-ambientes {
            filter:
                brightness(0.20);

            -webkit-filter:
                brightness(0.20);
        }


        /* =====================================================
           PANTALLAS CON RESOLUCIÓN MENOR
        ===================================================== */

        @media screen and (max-width: 900px) {

            .pantalla-completa {
                padding: 10px;
                gap: 10px;
            }


            .marco-superior {
                padding: 0 15px;
            }


            .tiempo-contenedor {
                min-width: 130px;
            }


            .panel-diagnostico {
                width: 290px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         FONDO
    ====================================================== -->

    <div
        class="background-ambientes"
        id="bg-ambientes">
    </div>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <div
        class="pantalla-completa"
        id="contenedor-principal">


        <!-- =================================================
             ENCABEZADO
        ================================================== -->

        <div
            class="marco-superior"
            id="barra-institucional">


            <div class="contenedor-logo">

                <img
                    class="logo-ccss"
                    src="logo-ccss.png"
                    alt="Logo CCSS"
                >

            </div>


            <div class="bloque-titulos">

                <div class="texto-institucion-gerencia">
                    Caja Costarricense de Seguro Social -
                    Gerencia de Logística
                </div>

                <div class="texto-direccion">
                    Dirección de Aprovisionamiento
                    de Bienes y Servicios
                </div>

            </div>


            <div class="tiempo-contenedor">

                <div
                    class="reloj"
                    id="reloj">
                    00:00
                </div>

                <div
                    class="fecha"
                    id="fecha">
                    Cargando...
                </div>

            </div>


        </div>


        <!-- =================================================
             SLIDESHOW
        ================================================== -->

        <div
            class="slideshow-container"
            id="slideshow">

            <div class="mensaje-estado">
                Cargando imágenes...
            </div>

        </div>


    </div>


    <!-- =====================================================
         INDICADOR Y DIAGNÓSTICO
    ====================================================== -->

    <div
        id="indicador-estado"
        class="indicador-estado estado-consultando"
        title="Consultando imágenes">
    </div>


    <div
        id="panel-diagnostico"
        class="panel-diagnostico">

        <div class="diagnostico-titulo">
            Diagnóstico de pantalla
        </div>

        <div id="diagnostico-contenido">
            Inicializando...
        </div>

    </div>



<script type="text/javascript">


/*
=========================================================
VERSIÓN COMPATIBLE CON NAVEGADORES ANTIGUOS
=========================================================

No utiliza:

- fetch
- async / await
- Promise
- let
- const
- funciones flecha
- template strings
- replaceChildren
- Array.from
- location.reload

=========================================================
*/


// ======================================================
// 1. CONFIGURACIÓN
// ======================================================

var usuarioGitHub =
    "evarsancr-creator";


var repositorioGitHub =
    "pantalla-tv";


var carpetaImagenes =
    "imagenes";


var tiempoPredeterminado =
    8000;


// Consulta normal cada 5 minutos.

var intervaloConsultaNormal =
    5 * 60 * 1000;


// Si la carga falla, reintenta en 30 segundos.

var intervaloReintentoError =
    30 * 1000;


// Máximo de espera para descargar una imagen.

var tiempoMaximoImagen =
    20000;



// ======================================================
// 2. VARIABLES
// ======================================================

var currentIndex =
    0;


var slides =
    [];


var backgroundSlides =
    [];


var timerSlide =
    null;


var timerConsulta =
    null;


var consultaEnProceso =
    false;


var cargaInicialCompletada =
    false;


var firmaImagenesActual =
    "";


var imagenesPendientes =
    null;


var firmaPendiente =
    "";


var estadoDiagnostico = {

    api:
        "Pendiente",

    archivosDetectados:
        0,

    imagenesValidas:
        0,

    imagenesConError:
        0,

    ultimaConsulta:
        "Sin consulta",

    ultimoError:
        "Ninguno"

};



// ======================================================
// 3. FUNCIONES DE COMPATIBILIDAD
// ======================================================

function agregarEvento(
    elemento,
    evento,
    funcion
) {

    if (!elemento) {
        return;
    }


    if (elemento.addEventListener) {

        elemento.addEventListener(
            evento,
            funcion,
            false
        );

    }

    else if (elemento.attachEvent) {

        elemento.attachEvent(
            "on" + evento,
            funcion
        );

    }

    else {

        elemento[
            "on" + evento
        ] = funcion;

    }

}



// ======================================================
// 4. INDICADOR DE ESTADO
// ======================================================

function establecerEstado(
    estado,
    texto
) {

    var indicador =
        document.getElementById(
            "indicador-estado"
        );


    if (!indicador) {
        return;
    }


    indicador.className =
        "indicador-estado";


    if (estado === "ok") {

        indicador.className +=
            " estado-ok";

    }

    else if (estado === "error") {

        indicador.className +=
            " estado-error";

    }

    else {

        indicador.className +=
            " estado-consultando";

    }


    indicador.title =
        texto || "";


    actualizarPanelDiagnostico();

}



// ======================================================
// 5. PANEL DE DIAGNÓSTICO
// ======================================================

function actualizarPanelDiagnostico() {

    var contenido =
        document.getElementById(
            "diagnostico-contenido"
        );


    if (!contenido) {
        return;
    }


    contenido.innerHTML =

        "<strong>API GitHub:</strong> "
        + escaparHTML(
            estadoDiagnostico.api
        )

        + "<br>"

        + "<strong>Archivos detectados:</strong> "
        + estadoDiagnostico.archivosDetectados

        + "<br>"

        + "<strong>Imágenes cargadas:</strong> "
        + estadoDiagnostico.imagenesValidas

        + "<br>"

        + "<strong>Imágenes con error:</strong> "
        + estadoDiagnostico.imagenesConError

        + "<br>"

        + "<strong>Última consulta:</strong> "
        + escaparHTML(
            estadoDiagnostico.ultimaConsulta
        )

        + "<br>"

        + "<strong>Último error:</strong> "
        + escaparHTML(
            estadoDiagnostico.ultimoError
        );

}



function alternarPanelDiagnostico() {

    var panel =
        document.getElementById(
            "panel-diagnostico"
        );


    if (!panel) {
        return;
    }


    if (
        panel.className.indexOf(
            "visible"
        ) >= 0
    ) {

        panel.className =
            "panel-diagnostico";

    }

    else {

        panel.className =
            "panel-diagnostico visible";

    }

}



function escaparHTML(
    texto
) {

    if (
        texto === null
        ||
        typeof texto === "undefined"
    ) {

        return "";

    }


    texto =
        String(
            texto
        );


    return texto
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



// ======================================================
// 6. HORA PARA DIAGNÓSTICO
// ======================================================

function obtenerHoraDiagnostico() {

    var ahora =
        new Date();


    var horas =
        ahora.getHours();


    var minutos =
        ahora.getMinutes();


    var segundos =
        ahora.getSeconds();


    if (minutos < 10) {
        minutos = "0" + minutos;
    }


    if (segundos < 10) {
        segundos = "0" + segundos;
    }


    return (
        horas
        + ":"
        + minutos
        + ":"
        + segundos
    );

}



// ======================================================
// 7. PROGRAMAR CONSULTA
// ======================================================

function programarConsulta(
    milisegundos
) {

    if (timerConsulta !== null) {

        clearTimeout(
            timerConsulta
        );

    }


    timerConsulta =
        setTimeout(
            function () {

                consultarImagenesGitHub();

            },
            milisegundos
        );

}



// ======================================================
// 8. CREAR XMLHTTPREQUEST
// ======================================================

function crearSolicitudHTTP() {

    var solicitud =
        null;


    if (
        typeof XMLHttpRequest !==
        "undefined"
    ) {

        solicitud =
            new XMLHttpRequest();

    }

    else {

        /*
            Compatibilidad con versiones antiguas
            de Internet Explorer.
        */

        try {

            solicitud =
                new ActiveXObject(
                    "Msxml2.XMLHTTP"
                );

        }

        catch (errorUno) {

            try {

                solicitud =
                    new ActiveXObject(
                        "Microsoft.XMLHTTP"
                    );

            }

            catch (errorDos) {

                solicitud =
                    null;

            }

        }

    }


    return solicitud;

}



// ======================================================
// 9. CONSULTAR GITHUB
// ======================================================

function consultarImagenesGitHub() {

    if (consultaEnProceso) {
        return;
    }


    consultaEnProceso =
        true;


    estadoDiagnostico.ultimaConsulta =
        obtenerHoraDiagnostico();


    estadoDiagnostico.ultimoError =
        "Ninguno";


    establecerEstado(
        "consultando",
        "Consultando imágenes"
    );


    var solicitud =
        crearSolicitudHTTP();


    if (!solicitud) {

        finalizarConsultaConError(
            "El navegador no admite solicitudes HTTP."
        );

        return;

    }


    var marcaTiempo =
        new Date().getTime();


    var apiURL =

        "https://api.github.com/repos/"
        + usuarioGitHub
        + "/"
        + repositorioGitHub
        + "/contents/"
        + carpetaImagenes
        + "?_="
        + marcaTiempo;


    solicitud.onreadystatechange =
        function () {

            if (
                solicitud.readyState !== 4
            ) {

                return;

            }


            if (
                solicitud.status >= 200
                &&
                solicitud.status < 300
            ) {

                procesarRespuestaGitHub(
                    solicitud.responseText
                );

            }

            else {

                finalizarConsultaConError(
                    "GitHub respondió con estado "
                    + solicitud.status
                );

            }

        };


    solicitud.onerror =
        function () {

            finalizarConsultaConError(
                "Error de conexión con GitHub."
            );

        };


    solicitud.ontimeout =
        function () {

            finalizarConsultaConError(
                "GitHub tardó demasiado en responder."
            );

        };


    try {

        solicitud.open(
            "GET",
            apiURL,
            true
        );


        /*
            Si el navegador no reconoce timeout,
            simplemente ignorará esta propiedad.
        */

        try {

            solicitud.timeout =
                25000;

        }

        catch (errorTimeout) {
        }


        /*
            Evitar reutilizar una respuesta anterior.
        */

        try {

            solicitud.setRequestHeader(
                "Cache-Control",
                "no-cache"
            );

        }

        catch (errorCabecera) {
        }


        solicitud.send(
            null
        );

    }

    catch (errorSolicitud) {

        finalizarConsultaConError(
            "No se pudo iniciar la consulta: "
            + errorSolicitud.message
        );

    }

}



// ======================================================
// 10. PROCESAR RESPUESTA DE GITHUB
// ======================================================

function procesarRespuestaGitHub(
    textoRespuesta
) {

    var archivos;


    try {

        archivos =
            JSON.parse(
                textoRespuesta
            );

    }

    catch (errorJSON) {

        finalizarConsultaConError(
            "El navegador no pudo interpretar la respuesta de GitHub."
        );

        return;

    }


    if (
        !archivos
        ||
        typeof archivos.length ===
        "undefined"
    ) {

        finalizarConsultaConError(
            "GitHub no devolvió una lista de archivos."
        );

        return;

    }


    estadoDiagnostico.api =
        "Correcta";


    var imagenes =
        [];


    var indice;


    for (
        indice = 0;
        indice < archivos.length;
        indice++
    ) {

        var archivo =
            archivos[indice];


        if (
            archivo
            &&
            archivo.type === "file"
            &&
            esArchivoImagen(
                archivo.name
            )
        ) {

            imagenes.push(
                archivo
            );

        }

    }


    ordenarImagenesPorNombre(
        imagenes
    );


    estadoDiagnostico.archivosDetectados =
        imagenes.length;


    if (
        imagenes.length === 0
    ) {

        finalizarConsultaConError(
            "La carpeta no contiene imágenes compatibles."
        );

        return;

    }


    var nuevaFirma =
        crearFirma(
            imagenes
        );


    /*
        Si ya tenemos presentación y no hubo cambios,
        no descargamos nuevamente los archivos.
    */

    if (
        cargaInicialCompletada
        &&
        nuevaFirma ===
        firmaImagenesActual
    ) {

        consultaEnProceso =
            false;


        estadoDiagnostico.imagenesValidas =
            slides.length;


        estadoDiagnostico.imagenesConError =
            0;


        estadoDiagnostico.ultimoError =
            "Ninguno";


        establecerEstado(
            "ok",
            slides.length
            + " imágenes activas"
        );


        programarConsulta(
            intervaloConsultaNormal
        );


        return;

    }


    /*
        Validamos las imágenes una por una.

        Esta estrategia es más compatible que
        Promise.all.
    */

    precargarImagenesSecuencialmente(
        imagenes,
        0,
        [],
        nuevaFirma
    );

}



// ======================================================
// 11. IDENTIFICAR ARCHIVOS DE IMAGEN
// ======================================================

function esArchivoImagen(
    nombre
) {

    if (!nombre) {
        return false;
    }


    return (
        /\.(png|jpg|jpeg|webp|gif)$/i
    ).test(
        nombre
    );

}



// ======================================================
// 12. ORDENAR POR NOMBRE
// ======================================================

function ordenarImagenesPorNombre(
    imagenes
) {

    imagenes.sort(
        function (
            archivoA,
            archivoB
        ) {

            var nombreA =
                String(
                    archivoA.name
                ).toLowerCase();


            var nombreB =
                String(
                    archivoB.name
                ).toLowerCase();


            if (
                nombreA < nombreB
            ) {

                return -1;

            }


            if (
                nombreA > nombreB
            ) {

                return 1;

            }


            return 0;

        }
    );

}



// ======================================================
// 13. CREAR FIRMA
// ======================================================

function crearFirma(
    imagenes
) {

    var partes =
        [];


    var indice;


    for (
        indice = 0;
        indice < imagenes.length;
        indice++
    ) {

        partes.push(

            imagenes[indice].name
            + ":"
            + imagenes[indice].sha

        );

    }


    return partes.join(
        "|"
    );

}



// ======================================================
// 14. CONSTRUIR URL DE IMAGEN
//
// IMPORTANTE:
//
// Ya no usamos download_url.
//
// La imagen se solicita desde el mismo sitio
// donde está abierto index.html:
//
// imagenes/archivo.png
//
// Esto evita depender directamente de
// raw.githubusercontent.com.
// ======================================================

function construirUrlImagen(
    archivo
) {

    var nombreCodificado =
        codificarRutaArchivo(
            archivo.name
        );


    return (
        carpetaImagenes
        + "/"
        + nombreCodificado
        + "?v="
        + encodeURIComponent(
            archivo.sha
        )
    );

}



// ======================================================
// 15. CODIFICAR NOMBRE DE ARCHIVO
// ======================================================

function codificarRutaArchivo(
    nombre
) {

    /*
        encodeURIComponent maneja:
        - espacios;
        - acentos;
        - paréntesis;
        - caracteres especiales.
    */

    return encodeURIComponent(
        nombre
    )
    .replace(
        /%2F/gi,
        "/"
    );

}



// ======================================================
// 16. PRECARGA SECUENCIAL
// ======================================================

function precargarImagenesSecuencialmente(
    imagenes,
    posicion,
    imagenesValidas,
    nuevaFirmaOriginal
) {

    if (
        posicion >= imagenes.length
    ) {

        procesarResultadoPrecarga(
            imagenes,
            imagenesValidas,
            nuevaFirmaOriginal
        );

        return;

    }


    var archivo =
        imagenes[posicion];


    precargarUnaImagen(
        archivo,
        function (
            resultado
        ) {

            if (resultado) {

                imagenesValidas.push(
                    archivo
                );

            }


            precargarImagenesSecuencialmente(
                imagenes,
                posicion + 1,
                imagenesValidas,
                nuevaFirmaOriginal
            );

        }
    );

}



// ======================================================
// 17. PRECARGAR UNA IMAGEN
// ======================================================

function precargarUnaImagen(
    archivo,
    callback
) {

    var imagen =
        new Image();


    var finalizado =
        false;


    var urlImagen =
        construirUrlImagen(
            archivo
        );


    var temporizador =
        setTimeout(
            function () {

                if (finalizado) {
                    return;
                }


                finalizado =
                    true;


                callback(
                    false
                );

            },
            tiempoMaximoImagen
        );


    imagen.onload =
        function () {

            if (finalizado) {
                return;
            }


            finalizado =
                true;


            clearTimeout(
                temporizador
            );


            callback(
                true
            );

        };


    imagen.onerror =
        function () {

            if (finalizado) {
                return;
            }


            finalizado =
                true;


            clearTimeout(
                temporizador
            );


            callback(
                false
            );

        };


    imagen.src =
        urlImagen;

}



// ======================================================
// 18. RESULTADO DE PRECARGA
// ======================================================

function procesarResultadoPrecarga(
    imagenesOriginales,
    imagenesValidas,
    nuevaFirmaOriginal
) {

    consultaEnProceso =
        false;


    estadoDiagnostico.imagenesValidas =
        imagenesValidas.length;


    estadoDiagnostico.imagenesConError =
        imagenesOriginales.length
        -
        imagenesValidas.length;


    if (
        imagenesValidas.length === 0
    ) {

        finalizarConsultaConError(
            "La API respondió, pero ninguna imagen pudo descargarse."
        );

        return;

    }


    var firmaValida =
        crearFirma(
            imagenesValidas
        );


    /*
        Primera carga.
    */

    if (
        !cargaInicialCompletada
    ) {

        aplicarNuevaLista(
            imagenesValidas,
            firmaValida
        );


        cargaInicialCompletada =
            true;


        estadoDiagnostico.ultimoError =
            estadoDiagnostico.imagenesConError > 0
            ? "Algunas imágenes no pudieron cargarse."
            : "Ninguno";


        establecerEstado(
            "ok",
            imagenesValidas.length
            + " imágenes cargadas"
        );


        programarConsulta(
            intervaloConsultaNormal
        );


        return;

    }


    /*
        Si la lista validada es igual a la actual,
        no hacemos cambios.
    */

    if (
        firmaValida ===
        firmaImagenesActual
    ) {

        imagenesPendientes =
            null;


        firmaPendiente =
            "";


        establecerEstado(
            "ok",
            slides.length
            + " imágenes activas"
        );


        programarConsulta(
            intervaloConsultaNormal
        );


        return;

    }


    /*
        Guardar actualización.

        Se aplicará al finalizar la vuelta actual.
    */

    imagenesPendientes =
        imagenesValidas;


    firmaPendiente =
        firmaValida;


    establecerEstado(
        "ok",
        "Actualización preparada"
    );


    programarConsulta(
        intervaloConsultaNormal
    );

}



// ======================================================
// 19. ERROR DE CONSULTA
// ======================================================

function finalizarConsultaConError(
    mensaje
) {

    consultaEnProceso =
        false;


    estadoDiagnostico.ultimoError =
        mensaje;


    establecerEstado(
        "error",
        mensaje
    );


    /*
        Si todavía no existe presentación,
        mostramos el mensaje.

        Si ya hay imágenes visibles,
        se conservan.
    */

    if (
        !cargaInicialCompletada
    ) {

        mostrarMensaje(
            "Intentando cargar las imágenes..."
        );

    }


    programarConsulta(
        intervaloReintentoError
    );

}



// ======================================================
// 20. APLICAR NUEVA LISTA
// ======================================================

function aplicarNuevaLista(
    imagenes,
    nuevaFirma
) {

    if (
        !imagenes
        ||
        imagenes.length === 0
    ) {

        return;

    }


    if (
        timerSlide !== null
    ) {

        clearTimeout(
            timerSlide
        );

    }


    var contenedorPrincipal =
        document.getElementById(
            "slideshow"
        );


    var contenedorFondos =
        document.getElementById(
            "bg-ambientes"
        );


    if (
        !contenedorPrincipal
        ||
        !contenedorFondos
    ) {

        finalizarConsultaConError(
            "No se encontraron los contenedores de la presentación."
        );

        return;

    }


    var fragmentoSlides =
        document.createDocumentFragment();


    var fragmentoFondos =
        document.createDocumentFragment();


    var indice;


    for (
        indice = 0;
        indice < imagenes.length;
        indice++
    ) {

        var archivo =
            imagenes[indice];


        var urlImagen =
            construirUrlImagen(
                archivo
            );


        // ==============================================
        // IMAGEN PRINCIPAL
        // ==============================================

        var slide =
            document.createElement(
                "img"
            );


        slide.className =
            "slide";


        slide.src =
            urlImagen;


        slide.alt =
            archivo.name;


        slide.setAttribute(
            "data-tiempo",
            String(
                tiempoPredeterminado
            )
        );


        slide.setAttribute(
            "data-nombre",
            archivo.name
        );


        slide.setAttribute(
            "data-sha",
            archivo.sha
        );


        if (indice === 0) {

            slide.className +=
                " active";

        }


        fragmentoSlides.appendChild(
            slide
        );


        // ==============================================
        // FONDO
        // ==============================================

        var fondo =
            document.createElement(
                "img"
            );


        fondo.className =
            "slide-bg";


        fondo.src =
            urlImagen;


        fondo.alt =
            "";


        fondo.setAttribute(
            "aria-hidden",
            "true"
        );


        if (indice === 0) {

            fondo.className +=
                " active";

        }


        fragmentoFondos.appendChild(
            fondo
        );

    }


    /*
        No usamos replaceChildren().
    */

    contenedorPrincipal.innerHTML =
        "";


    contenedorFondos.innerHTML =
        "";


    contenedorPrincipal.appendChild(
        fragmentoSlides
    );


    contenedorFondos.appendChild(
        fragmentoFondos
    );


    /*
        Convertimos NodeList en arreglos usando ciclos.
        No usamos Array.from().
    */

    slides =
        [];


    backgroundSlides =
        [];


    var nodosSlides =
        contenedorPrincipal
            .getElementsByTagName(
                "img"
            );


    var nodosFondos =
        contenedorFondos
            .getElementsByTagName(
                "img"
            );


    for (
        indice = 0;
        indice < nodosSlides.length;
        indice++
    ) {

        slides.push(
            nodosSlides[indice]
        );

    }


    for (
        indice = 0;
        indice < nodosFondos.length;
        indice++
    ) {

        backgroundSlides.push(
            nodosFondos[indice]
        );

    }


    currentIndex =
        0;


    firmaImagenesActual =
        nuevaFirma;


    imagenesPendientes =
        null;


    firmaPendiente =
        "";


    programarSiguienteCambio();

}



// ======================================================
// 21. CAMBIAR IMAGEN
// ======================================================

function cambiarSlide() {

    if (
        !slides
        ||
        slides.length === 0
    ) {

        return;

    }


    /*
        Si solo existe una imagen.
    */

    if (
        slides.length === 1
    ) {

        if (
            imagenesPendientes !== null
        ) {

            aplicarNuevaLista(
                imagenesPendientes,
                firmaPendiente
            );


            return;

        }


        programarSiguienteCambio();


        return;

    }


    var siguienteIndice =

        (
            currentIndex + 1
        )

        %

        slides.length;


    var vueltaTerminada =
        siguienteIndice === 0;


    /*
        Aplicar actualización al terminar la vuelta.
    */

    if (
        vueltaTerminada
        &&
        imagenesPendientes !== null
    ) {

        aplicarNuevaLista(
            imagenesPendientes,
            firmaPendiente
        );


        return;

    }


    quitarClase(
        slides[currentIndex],
        "active"
    );


    if (
        backgroundSlides[currentIndex]
    ) {

        quitarClase(
            backgroundSlides[currentIndex],
            "active"
        );

    }


    currentIndex =
        siguienteIndice;


    agregarClase(
        slides[currentIndex],
        "active"
    );


    if (
        backgroundSlides[currentIndex]
    ) {

        agregarClase(
            backgroundSlides[currentIndex],
            "active"
        );

    }


    programarSiguienteCambio();

}



// ======================================================
// 22. PROGRAMAR SIGUIENTE
// ======================================================

function programarSiguienteCambio() {

    if (
        !slides
        ||
        slides.length === 0
    ) {

        return;

    }


    var valorTiempo =
        slides[currentIndex]
            .getAttribute(
                "data-tiempo"
            );


    var tiempoActual =
        parseInt(
            valorTiempo,
            10
        );


    if (
        isNaN(
            tiempoActual
        )
    ) {

        tiempoActual =
            tiempoPredeterminado;

    }


    if (
        timerSlide !== null
    ) {

        clearTimeout(
            timerSlide
        );

    }


    timerSlide =
        setTimeout(
            function () {

                cambiarSlide();

            },
            tiempoActual
        );

}



// ======================================================
// 23. AGREGAR Y QUITAR CLASES
// ======================================================

function agregarClase(
    elemento,
    nombreClase
) {

    if (!elemento) {
        return;
    }


    if (
        elemento.className.indexOf(
            nombreClase
        ) < 0
    ) {

        elemento.className +=
            " "
            +
            nombreClase;

    }

}



function quitarClase(
    elemento,
    nombreClase
) {

    if (!elemento) {
        return;
    }


    var expresion =
        new RegExp(
            "(^|\\s)"
            + nombreClase
            + "(\\s|$)",
            "g"
        );


    elemento.className =
        elemento.className
            .replace(
                expresion,
                " "
            )
            .replace(
                /^\s+|\s+$/g,
                ""
            );

}



// ======================================================
// 24. MENSAJE
// ======================================================

function mostrarMensaje(
    mensaje
) {

    var contenedor =
        document.getElementById(
            "slideshow"
        );


    if (!contenedor) {
        return;
    }


    contenedor.innerHTML =
        "";


    var elementoMensaje =
        document.createElement(
            "div"
        );


    elementoMensaje.className =
        "mensaje-estado";


    /*
        textContent no está disponible en algunos
        navegadores muy antiguos.
    */

    if (
        typeof elementoMensaje.textContent !==
        "undefined"
    ) {

        elementoMensaje.textContent =
            mensaje;

    }

    else {

        elementoMensaje.innerText =
            mensaje;

    }


    contenedor.appendChild(
        elementoMensaje
    );

}



// ======================================================
// 25. RELOJ Y FECHA
//
// Evitamos depender de configuraciones avanzadas
// de toLocaleDateString.
// ======================================================

function actualizarTiempo() {

    var ahora =
        new Date();


    var horas =
        ahora.getHours();


    var minutos =
        ahora.getMinutes();


    if (
        minutos < 10
    ) {

        minutos =
            "0"
            +
            minutos;

    }


    /*
        Convertir a 12 horas sin AM/PM.
    */

    var horaDoce =
        horas % 12;


    if (
        horaDoce === 0
    ) {

        horaDoce =
            12;

    }


    var textoHora =
        horaDoce
        + ":"
        + minutos;


    var elementoReloj =
        document.getElementById(
            "reloj"
        );


    if (elementoReloj) {

        establecerTexto(
            elementoReloj,
            textoHora
        );

    }


    var diasSemana = [
        "Domingo",
        "Lunes",
        "Martes",
        "Miércoles",
        "Jueves",
        "Viernes",
        "Sábado"
    ];


    var meses = [
        "enero",
        "febrero",
        "marzo",
        "abril",
        "mayo",
        "junio",
        "julio",
        "agosto",
        "septiembre",
        "octubre",
        "noviembre",
        "diciembre"
    ];


    var textoFecha =

        diasSemana[
            ahora.getDay()
        ]

        + " "

        + ahora.getDate()

        + " de "

        + meses[
            ahora.getMonth()
        ];


    var elementoFecha =
        document.getElementById(
            "fecha"
        );


    if (elementoFecha) {

        establecerTexto(
            elementoFecha,
            textoFecha
        );

    }


    /*
        Modo eco:
        antes de las 7:00
        y desde las 16:00.
    */

    if (
        horas < 7
        ||
        horas >= 16
    ) {

        agregarClase(
            document.body,
            "modo-eco"
        );

    }

    else {

        quitarClase(
            document.body,
            "modo-eco"
        );

    }

}



// ======================================================
// 26. ESTABLECER TEXTO
// ======================================================

function establecerTexto(
    elemento,
    texto
) {

    if (!elemento) {
        return;
    }


    if (
        typeof elemento.textContent !==
        "undefined"
    ) {

        elemento.textContent =
            texto;

    }

    else {

        elemento.innerText =
            texto;

    }

}



// ======================================================
// 27. PIXEL SHIFT
// ======================================================

function ejecutarPixelShift() {

    var barra =
        document.getElementById(
            "barra-institucional"
        );


    if (!barra) {
        return;
    }


    var desvioTop =
        Math.floor(
            Math.random() * 5
        )
        -
        2;


    var desvioLeft =
        Math.floor(
            Math.random() * 5
        )
        -
        2;


    barra.style.top =
        desvioTop
        +
        "px";


    barra.style.left =
        desvioLeft
        +
        "px";

}



// ======================================================
// 28. INICIAR
// ======================================================

function iniciarPantalla() {

    var indicador =
        document.getElementById(
            "indicador-estado"
        );


    agregarEvento(
        indicador,
        "click",
        alternarPanelDiagnostico
    );


    actualizarTiempo();


    consultarImagenesGitHub();


    setInterval(
        actualizarTiempo,
        15000
    );


    setInterval(
        ejecutarPixelShift,
        60000
    );

}



// ======================================================
// 29. INICIAR AL TERMINAR DE CARGAR EL HTML
// ======================================================

if (
    document.readyState === "complete"
    ||
    document.readyState === "interactive"
) {

    iniciarPantalla();

}

else {

    agregarEvento(
        window,
        "load",
        iniciarPantalla
    );

}

=========================================================

IMPORTANTE

Este código no utiliza location.reload().

La página sigue abierta y consulta cambios mediante
XMLHttpRequest.

Si la consulta falla:

- no recarga el navegador;
- no vuelve a pedir aceptar certificados;
- reintenta después de 30 segundos;
- conserva las imágenes anteriores si ya estaban visibles.

Selecciona el punto de estado para mostrar el panel de
diagnóstico.

=========================================================
*/
