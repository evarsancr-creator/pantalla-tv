        <!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pantalla Corporativa DABS</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background-color: #0d1117;
        }


        /* =====================================================
           CONTENEDOR GENERAL
        ===================================================== */

        .pantalla-completa {
            display: flex;
            flex-direction: column;

            width: 100vw;
            height: 100vh;

            padding: 20px;
            gap: 15px;

            position: relative;
            z-index: 5;
        }


        /* =====================================================
           ENCABEZADO
        ===================================================== */

        .marco-superior {
            width: 100%;
            height: 15vh;

            background:
                rgba(13, 17, 23, 0.15);

            backdrop-filter:
                blur(5px);

            -webkit-backdrop-filter:
                blur(5px);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 16px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            padding:
                0 30px;

            box-shadow:
                0 8px 32px
                rgba(0, 0, 0, 0.4);

            position: relative;

            top: 0;
            left: 0;

            transition:
                top 0.5s ease,
                left 0.5s ease,
                opacity 1s ease,
                filter 1s ease;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .contenedor-logo {
            height: 80%;

            display: flex;

            align-items: center;
        }


        .logo-ccss {
            height: 100%;

            object-fit:
                contain;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(255, 255, 255, 0.15)
                );
        }


        /* =====================================================
           TÍTULOS
        ===================================================== */

        .bloque-titulos {
            display: flex;

            flex-direction:
                column;

            justify-content:
                center;

            align-items:
                center;

            flex-grow: 1;

            padding:
                0 20px;

            text-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.8);
        }


        .texto-institucion-gerencia {
            color:
                #60a5fa;

            font-size:
                1.1vw;

            font-weight:
                600;

            letter-spacing:
                1px;

            text-transform:
                uppercase;

            margin-bottom:
                2px;

            text-align:
                center;
        }


        .texto-direccion {
            color:
                #e2e8f0;

            font-size:
                1.9vw;

            font-weight:
                700;

            letter-spacing:
                0.5px;

            text-transform:
                uppercase;

            text-align:
                center;
        }


        /* =====================================================
           RELOJ
        ===================================================== */

        .tiempo-contenedor {
            display:
                flex;

            flex-direction:
                column;

            align-items:
                flex-end;

            justify-content:
                center;

            min-width:
                220px;
        }


        .reloj {
            color:
                #cbd5e1;

            font-size:
                2.4vw;

            font-weight:
                700;

            font-family:
                "Segoe UI",
                sans-serif;

            text-shadow:
                0 0 8px
                rgba(224, 242, 254, 0.2),

                0 2px 4px
                rgba(0, 0, 0, 0.6);

            line-height:
                1;

            margin-bottom:
                4px;

            letter-spacing:
                -1px;
        }


        .fecha {
            color:
                #94a3b8;

            font-size:
                1.1vw;

            font-weight:
                500;

            letter-spacing:
                0.5px;

            text-shadow:
                0 1px 3px
                rgba(0, 0, 0, 0.6);
        }


        /* =====================================================
           SLIDESHOW
        ===================================================== */

        .slideshow-container {
            width:
                100%;

            height:
                79vh;

            position:
                relative;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            background-color:
                rgba(0, 0, 0, 0.2);

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius:
                20px;

            overflow:
                hidden;

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, 0.6);
        }


        /* =====================================================
           IMAGEN PRINCIPAL

           Este es el cambio para imágenes pequeñas.
           Ocupa todo el área disponible sin deformarla.
        ===================================================== */

        img.slide {

            position:
                absolute;

            top:
                0;

            left:
                0;

            width:
                100%;

            height:
                100%;

            object-fit:
                contain;

            object-position:
                center center;

            opacity:
                0;

            z-index:
                2;

            transform:
                scale(0.98);

            transition:
                opacity 1.2s ease-in-out,
                transform 1.2s ease-in-out;
        }


        img.slide.active {

            opacity:
                1;

            transform:
                scale(1);
        }


        /* =====================================================
           FONDO AMBIENTE
        ===================================================== */

        .background-ambientes {

            position:
                absolute;

            top:
                0;

            left:
                0;

            width:
                100vw;

            height:
                100vh;

            z-index:
                1;

            overflow:
                hidden;

            background-color:
                #0d1117;

            transition:
                filter 1s ease;
        }


        img.slide-bg {

            position:
                absolute;

            top:
                -5%;

            left:
                -5%;

            width:
                110%;

            height:
                110%;

            object-fit:
                cover;

            opacity:
                0;

            filter:
                blur(60px)
                brightness(0.4)
                saturate(1.4);

            transform:
                scale(1.08);

            transition:
                opacity 1.2s ease-in-out;
        }


        img.slide-bg.active {

            opacity:
                1;
        }


        /* =====================================================
           MENSAJE
        ===================================================== */

        .mensaje-estado {

            color:
                #cbd5e1;

            font-size:
                1.3vw;

            font-weight:
                500;

            text-align:
                center;

            padding:
                30px;

            z-index:
                10;
        }


        /* =====================================================
           INDICADOR
        ===================================================== */

        .indicador-estado {

            position:
                fixed;

            right:
                8px;

            bottom:
                8px;

            width:
                10px;

            height:
                10px;

            border-radius:
                50%;

            background:
                #64748b;

            z-index:
                100;

            opacity:
                0.65;

            box-shadow:
                0 0 6px
                rgba(255, 255, 255, 0.15);

            transition:
                background 0.4s ease;
        }


        .estado-ok {

            background:
                #22c55e;

        }


        .estado-consultando {

            background:
                #f59e0b;

        }


        .estado-error {

            background:
                #ef4444;

        }


        /* =====================================================
           MODO ECO
        ===================================================== */

        .modo-eco .marco-superior {

            opacity:
                0.3;

            background:
                rgba(13, 17, 23, 0.3);

            filter:
                grayscale(0.5);
        }


        .modo-eco .background-ambientes {

            filter:
                brightness(0.1);
        }


        /* =====================================================
           RESOLUCIONES MENORES
        ===================================================== */

        @media
        (max-width: 900px) {

            .pantalla-completa {

                padding:
                    10px;

                gap:
                    10px;
            }


            .marco-superior {

                padding:
                    0 15px;
            }


            .tiempo-contenedor {

                min-width:
                    140px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         FONDO
    ====================================================== -->

    <div
        class="background-ambientes"
        id="bg-ambientes">
    </div>


    <!-- =====================================================
         CONTENIDO
    ====================================================== -->

    <div
        class="pantalla-completa"
        id="contenedor-principal">


        <!-- =================================================
             ENCABEZADO
        ================================================== -->

        <header
            class="marco-superior"
            id="barra-institucional">


            <div
                class="contenedor-logo">

                <img
                    class="logo-ccss"
                    src="logo-ccss.png"
                    alt="Logo CCSS"
                >

            </div>


            <div
                class="bloque-titulos">


                <h2
                    class="texto-institucion-gerencia">

                    Caja Costarricense de Seguro Social -
                    Gerencia de Logística

                </h2>


                <h1
                    class="texto-direccion">

                    Dirección de Aprovisionamiento
                    de Bienes y Servicios

                </h1>


            </div>


            <div
                class="tiempo-contenedor">


                <div
                    class="reloj"
                    id="reloj">

                    00:00

                </div>


                <div
                    class="fecha"
                    id="fecha">

                    Cargando...

                </div>


            </div>


        </header>


        <!-- =================================================
             PRESENTACIÓN
        ================================================== -->

        <main
            class="slideshow-container"
            id="slideshow">


            <div
                class="mensaje-estado">

                Cargando imágenes...

            </div>


        </main>


    </div>


    <!-- =====================================================
         INDICADOR
    ====================================================== -->

    <div
        id="indicador-estado"
        class="indicador-estado estado-consultando"
        title="Inicializando">
    </div>



<script>


// ======================================================
// 1. CONFIGURACIÓN
// ======================================================

const usuarioGitHub =
    "evarsancr-creator";


const repositorioGitHub =
    "pantalla-tv";


const carpetaImagenes =
    "imagenes";


// Cada imagen:
// 8 segundos.

const tiempoPredeterminado =
    8000;


// Consulta GitHub:
// cada 5 minutos.

const intervaloConsultaNormal =
    5 * 60 * 1000;


// Si ocurre un error:
// reintentar en 30 segundos.

const intervaloReintentoError =
    30 * 1000;


// Tiempo máximo para precargar
// una imagen.

const tiempoMaximoPrecarga =
    20000;



// ======================================================
// 2. VARIABLES
// ======================================================

let currentIndex =
    0;


let slides =
    [];


let backgroundSlides =
    [];


let timerSlide =
    null;


let timerConsulta =
    null;


let consultaEnProceso =
    false;


let cargaInicialCompletada =
    false;


let firmaImagenesActual =
    "";


let imagenesPendientes =
    null;


let firmaPendiente =
    "";



// ======================================================
// 3. ESTADO
// ======================================================

function establecerEstado(
    estado,
    texto
) {


    const indicador =
        document.getElementById(
            "indicador-estado"
        );


    if (!indicador) {

        return;

    }


    indicador.className =
        "indicador-estado";


    if (
        estado === "ok"
    ) {


        indicador.classList.add(
            "estado-ok"
        );


    }

    else if (
        estado === "error"
    ) {


        indicador.classList.add(
            "estado-error"
        );


    }

    else {


        indicador.classList.add(
            "estado-consultando"
        );


    }


    indicador.title =
        texto || "";

}



// ======================================================
// 4. PROGRAMAR SIGUIENTE CONSULTA
// ======================================================

function programarConsulta(
    milisegundos
) {


    clearTimeout(
        timerConsulta
    );


    timerConsulta =
        setTimeout(

            consultarImagenesGitHub,

            milisegundos

        );

}



// ======================================================
// 5. CONSULTAR GITHUB
// ======================================================

async function consultarImagenesGitHub() {


    if (
        consultaEnProceso
    ) {

        return;

    }


    consultaEnProceso =
        true;


    establecerEstado(
        "consultando",
        "Consultando GitHub"
    );


    try {


        const apiURL =

            "https://api.github.com/repos/"

            +

            usuarioGitHub

            +

            "/"

            +

            repositorioGitHub

            +

            "/contents/"

            +

            carpetaImagenes;



        /*
            IMPORTANTE:

            Volvemos al fetch sencillo que sí funcionaba.

            No agregamos headers adicionales.
            No agregamos parámetros extra.
        */

        const respuesta =
            await fetch(
                apiURL,
                {
                    cache:
                        "no-store"
                }
            );



        if (
            !respuesta.ok
        ) {


            throw new Error(

                "GitHub respondió con estado "

                +

                respuesta.status

            );


        }



        const archivos =
            await respuesta.json();



        if (
            !Array.isArray(
                archivos
            )
        ) {


            throw new Error(
                "GitHub no devolvió una lista de archivos."
            );


        }



        // ==================================================
        // FILTRAR IMÁGENES
        // ==================================================

        const imagenes =
            archivos
                .filter(

                    archivo =>

                        archivo.type ===
                        "file"

                        &&

                        /\.(png|jpg|jpeg|webp|gif)$/i
                            .test(
                                archivo.name
                            )

                )
                .sort(

                    (a, b) =>

                        a.name.localeCompare(
                            b.name,
                            "es",
                            {
                                numeric:
                                    true,

                                sensitivity:
                                    "base"
                            }
                        )

                );



        if (
            imagenes.length === 0
        ) {


            throw new Error(
                "No se encontraron imágenes."
            );


        }



        // ==================================================
        // FIRMA DE LA LISTA
        // ==================================================

        const nuevaFirma =
            crearFirma(
                imagenes
            );



        // ==================================================
        // PRIMERA CARGA
        // ==================================================

        if (
            !cargaInicialCompletada
        ) {


            const imagenesValidas =
                await precargarImagenes(
                    imagenes
                );


            if (
                imagenesValidas.length === 0
            ) {


                throw new Error(
                    "No fue posible descargar ninguna imagen."
                );


            }



            const firmaValida =
                crearFirma(
                    imagenesValidas
                );



            aplicarNuevaLista(
                imagenesValidas,
                firmaValida
            );


            cargaInicialCompletada =
                true;


            establecerEstado(
                "ok",
                imagenesValidas.length
                +
                " imágenes cargadas"
            );


            programarConsulta(
                intervaloConsultaNormal
            );


            return;

        }



        // ==================================================
        // NO HAY CAMBIOS
        // ==================================================

        if (
            nuevaFirma ===
            firmaImagenesActual
        ) {


            imagenesPendientes =
                null;


            firmaPendiente =
                "";


            establecerEstado(
                "ok",
                slides.length
                +
                " imágenes activas"
            );


            programarConsulta(
                intervaloConsultaNormal
            );


            return;

        }



        // ==================================================
        // EXISTEN CAMBIOS
        // ==================================================

        const imagenesValidas =
            await precargarImagenes(
                imagenes
            );



        if (
            imagenesValidas.length === 0
        ) {


            throw new Error(
                "La actualización no contiene imágenes disponibles."
            );


        }



        const firmaValida =
            crearFirma(
                imagenesValidas
            );



        if (
            firmaValida ===
            firmaImagenesActual
        ) {


            establecerEstado(
                "ok",
                slides.length
                +
                " imágenes activas"
            );


            programarConsulta(
                intervaloConsultaNormal
            );


            return;

        }



        /*
            No cambiamos la imagen inmediatamente.

            Guardamos la actualización
            y esperamos hasta terminar
            la vuelta actual.
        */

        imagenesPendientes =
            imagenesValidas;


        firmaPendiente =
            firmaValida;


        establecerEstado(
            "ok",
            "Actualización preparada"
        );


        programarConsulta(
            intervaloConsultaNormal
        );


    }


    catch (
        error
    ) {


        console.error(
            "ERROR:",
            error
        );


        establecerEstado(
            "error",
            error.message
        );



        /*
            Si todavía no existen imágenes,
            mostramos el mensaje.

            Si ya están funcionando,
            NO borramos el slideshow.
        */

        if (
            !cargaInicialCompletada
        ) {


            mostrarMensaje(
                "Intentando cargar las imágenes..."
            );


        }



        programarConsulta(
            intervaloReintentoError
        );


    }


    finally {


        consultaEnProceso =
            false;


    }

}



// ======================================================
// 6. CREAR FIRMA
// ======================================================

function crearFirma(
    imagenes
) {


    return imagenes
        .map(

            archivo =>

                archivo.name

                +

                ":"

                +

                archivo.sha

        )
        .join(
            "|"
        );

}



// ======================================================
// 7. URL DE IMAGEN
//
// IMPORTANTE:
//
// Conservamos download_url porque esta fue
// la arquitectura que previamente funcionó.
// ======================================================

function construirUrlImagen(
    archivo
) {


    return (

        archivo.download_url

        +

        "?v="

        +

        encodeURIComponent(
            archivo.sha
        )

    );

}



// ======================================================
// 8. PRECARGAR TODAS LAS IMÁGENES
// ======================================================

async function precargarImagenes(
    imagenes
) {


    const resultados =
        await Promise.all(

            imagenes.map(
                precargarUnaImagen
            )

        );



    const imagenesValidas =
        resultados.filter(

            resultado =>

                resultado !== null

        );



    console.log(

        "Imágenes válidas:",

        imagenesValidas.length,

        "de",

        imagenes.length

    );



    return imagenesValidas;

}



// ======================================================
// 9. PRECARGAR UNA IMAGEN
// ======================================================

function precargarUnaImagen(
    archivo
) {


    return new Promise(

        resolve => {


            const imagen =
                new Image();


            let terminado =
                false;


            const urlImagen =
                construirUrlImagen(
                    archivo
                );



            const timeout =
                setTimeout(

                    function () {


                        if (
                            terminado
                        ) {

                            return;

                        }


                        terminado =
                            true;


                        console.warn(
                            "Tiempo agotado:",
                            archivo.name
                        );


                        resolve(
                            null
                        );


                    },

                    tiempoMaximoPrecarga

                );



            imagen.onload =
                function () {


                    if (
                        terminado
                    ) {

                        return;

                    }


                    terminado =
                        true;


                    clearTimeout(
                        timeout
                    );


                    resolve(
                        archivo
                    );


                };



            imagen.onerror =
                function () {


                    if (
                        terminado
                    ) {

                        return;

                    }


                    terminado =
                        true;


                    clearTimeout(
                        timeout
                    );


                    console.warn(
                        "Error cargando:",
                        archivo.name
                    );


                    resolve(
                        null
                    );


                };



            imagen.src =
                urlImagen;


        }

    );

}



// ======================================================
// 10. APLICAR NUEVA LISTA
// ======================================================

function aplicarNuevaLista(
    imagenes,
    nuevaFirma
) {


    if (
        !imagenes
        ||
        imagenes.length === 0
    ) {


        return;


    }



    clearTimeout(
        timerSlide
    );



    const contenedorPrincipal =
        document.getElementById(
            "slideshow"
        );


    const contenedorFondos =
        document.getElementById(
            "bg-ambientes"
        );



    if (
        !contenedorPrincipal
        ||
        !contenedorFondos
    ) {


        throw new Error(
            "No se encontraron los contenedores."
        );


    }



    const fragmentoSlides =
        document.createDocumentFragment();


    const fragmentoFondos =
        document.createDocumentFragment();



    imagenes.forEach(

        (archivo, index) => {


            const urlImagen =
                construirUrlImagen(
                    archivo
                );



            // ==========================================
            // IMAGEN PRINCIPAL
            // ==========================================

            const slide =
                document.createElement(
                    "img"
                );


            slide.className =
                "slide";


            slide.src =
                urlImagen;


            slide.alt =
                archivo.name;


            slide.dataset.nombre =
                archivo.name;


            slide.dataset.sha =
                archivo.sha;


            slide.dataset.tiempo =
                String(
                    tiempoPredeterminado
                );



            if (
                index === 0
            ) {


                slide.classList.add(
                    "active"
                );


            }



            fragmentoSlides.appendChild(
                slide
            );



            // ==========================================
            // FONDO
            // ==========================================

            const fondo =
                document.createElement(
                    "img"
                );


            fondo.className =
                "slide-bg";


            fondo.src =
                urlImagen;


            fondo.alt =
                "";


            fondo.setAttribute(
                "aria-hidden",
                "true"
            );



            if (
                index === 0
            ) {


                fondo.classList.add(
                    "active"
                );


            }



            fragmentoFondos.appendChild(
                fondo
            );


        }

    );



    // ==================================================
    // CAMBIO DE COMPATIBILIDAD
    //
    // NO usamos replaceChildren().
    // ==================================================

    contenedorPrincipal.innerHTML =
        "";


    contenedorFondos.innerHTML =
        "";


    contenedorPrincipal.appendChild(
        fragmentoSlides
    );


    contenedorFondos.appendChild(
        fragmentoFondos
    );



    // ==================================================
    // ACTUALIZAR COLECCIONES
    // ==================================================

    slides =
        document.querySelectorAll(
            "#slideshow .slide"
        );


    backgroundSlides =
        document.querySelectorAll(
            "#bg-ambientes .slide-bg"
        );



    currentIndex =
        0;


    firmaImagenesActual =
        nuevaFirma;


    imagenesPendientes =
        null;


    firmaPendiente =
        "";



    console.log(
        "Slideshow cargado:",
        slides.length
    );



    programarSiguienteCambio();

}



// ======================================================
// 11. CAMBIAR SLIDE
// ======================================================

function changeSlide() {


    if (
        slides.length === 0
    ) {


        return;


    }



    // ==================================================
    // SOLO UNA IMAGEN
    // ==================================================

    if (
        slides.length === 1
    ) {


        if (
            imagenesPendientes !== null
        ) {


            aplicarNuevaLista(
                imagenesPendientes,
                firmaPendiente
            );


            return;


        }



        programarSiguienteCambio();


        return;

    }



    const siguienteIndice =

        (
            currentIndex + 1
        )

        %

        slides.length;



    const vueltaTerminada =

        siguienteIndice === 0;



    // ==================================================
    // CAMBIO PENDIENTE
    // ==================================================

    if (
        vueltaTerminada
        &&
        imagenesPendientes !== null
    ) {


        aplicarNuevaLista(
            imagenesPendientes,
            firmaPendiente
        );


        return;

    }



    // ==================================================
    // DESACTIVAR ACTUAL
    // ==================================================

    slides[
        currentIndex
    ]
        .classList
        .remove(
            "active"
        );



    if (
        backgroundSlides[
            currentIndex
        ]
    ) {


        backgroundSlides[
            currentIndex
        ]
            .classList
            .remove(
                "active"
            );


    }



    currentIndex =
        siguienteIndice;



    // ==================================================
    // ACTIVAR SIGUIENTE
    // ==================================================

    slides[
        currentIndex
    ]
        .classList
        .add(
            "active"
        );



    if (
        backgroundSlides[
            currentIndex
        ]
    ) {


        backgroundSlides[
            currentIndex
        ]
            .classList
            .add(
                "active"
            );


    }



    programarSiguienteCambio();

}



// ======================================================
// 12. PROGRAMAR PRÓXIMA IMAGEN
// ======================================================

function programarSiguienteCambio() {


    if (
        slides.length === 0
    ) {


        clearTimeout(
            timerSlide
        );


        return;


    }



    const tiempoActual =

        parseInt(

            slides[
                currentIndex
            ]
                .dataset
                .tiempo,

            10

        )

        ||

        tiempoPredeterminado;



    clearTimeout(
        timerSlide
    );



    timerSlide =
        setTimeout(

            changeSlide,

            tiempoActual

        );

}



// ======================================================
// 13. MENSAJE
// ======================================================

function mostrarMensaje(
    mensaje
) {


    const contenedor =
        document.getElementById(
            "slideshow"
        );


    if (
        !contenedor
    ) {


        return;


    }



    contenedor.innerHTML =
        "";



    const texto =
        document.createElement(
            "div"
        );


    texto.className =
        "mensaje-estado";


    texto.textContent =
        mensaje;



    contenedor.appendChild(
        texto
    );

}



// ======================================================
// 14. RELOJ + FECHA + MODO ECO
// ======================================================

function actualizarTiempo() {


    const ahora =
        new Date();



    // ==================================================
    // HORA
    // ==================================================

    const opcionesReloj = {

        hour:
            "numeric",

        minute:
            "2-digit",

        hour12:
            true

    };



    let hora12 =
        ahora.toLocaleTimeString(
            "es-CR",
            opcionesReloj
        );



    hora12 =
        hora12
            .replace(
                /\./g,
                ""
            )
            .replace(
                /[a-zA-Z]/g,
                ""
            )
            .trim();



    const elementoReloj =
        document.getElementById(
            "reloj"
        );



    if (
        elementoReloj
    ) {


        elementoReloj.textContent =
            hora12;


    }



    // ==================================================
    // FECHA
    // ==================================================

    const opcionesFecha = {

        weekday:
            "long",

        day:
            "numeric",

        month:
            "long"

    };



    let fechaTexto =
        ahora.toLocaleDateString(
            "es-ES",
            opcionesFecha
        );



    fechaTexto =

        fechaTexto
            .charAt(0)
            .toUpperCase()

        +

        fechaTexto
            .slice(1);



    const elementoFecha =
        document.getElementById(
            "fecha"
        );



    if (
        elementoFecha
    ) {


        elementoFecha.textContent =
            fechaTexto;


    }



    // ==================================================
    // MODO ECO
    // ==================================================

    const horaActual =
        ahora.getHours();



    if (
        horaActual < 7
        ||
        horaActual >= 16
    ) {


        document.body
            .classList
            .add(
                "modo-eco"
            );


    }

    else {


        document.body
            .classList
            .remove(
                "modo-eco"
            );


    }

}



// ======================================================
// 15. PIXEL SHIFT
// ======================================================

function ejecutarPixelShift() {


    const barra =
        document.getElementById(
            "barra-institucional"
        );


    if (
        !barra
    ) {


        return;


    }



    const desvioTop =

        Math.floor(
            Math.random() * 5
        )

        -

        2;



    const desvioLeft =

        Math.floor(
            Math.random() * 5
        )

        -

        2;



    barra.style.top =
        desvioTop
        +
        "px";


    barra.style.left =
        desvioLeft
        +
        "px";

}

// 16. INICIAR
// ======================================================


// Reloj inmediatamente.

actualizarTiempo();


// Primera consulta.

consultarImagenesGitHub();


// Reloj cada 15 segundos.

setInterval(
    actualizarTiempo,
    15000
);


// Pixel Shift cada minuto.

setInterval(
    ejecutarPixelShift,
    60000
);
